<!doctype html>
<!--
  ════════════════════════════════════════════════════════════════════════════
  Prism App Framework v2 — Dashboard starter (config-driven, multi-tab)
  ────────────────────────────────────────────────────────────────────────────
  This is a WORKING reference app. Open it directly in a browser (synthetic mode)
  to see the chrome + every section render before any agent edits.

  To build a real app: fill APP_CONFIG (one object, bottom of <script>). Each
  `sections[]` entry is a tab with its own layout / KPIs / charts / table / source.
  You do NOT hand-author per-section HTML — the generic renderer below does it.
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP_NAME__</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root {
    --font-sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --background:#ffffff; --surface:#f8f9fb; --surface-elevated:#ffffff;
    --border:#e5e9ef; --border-subtle:#f0f2f5; --border-strong:#b8c0cd;
    --foreground:#1a2035; --muted-foreground:#6b7694; --placeholder:#9aa3be;
    --primary:#4361ee; --primary-light:#eef0fd; --primary-hover:#3451d1;
    --positive:#2ec4b6; --positive-light:#e8faf8; --negative:#e63946; --negative-light:#fdecea;
    --warning:#f4a261; --warning-light:#fef3e8; --neutral:#8d99ae; --neutral-light:#f0f2f5;
    --info:#4895ef; --info-light:#eaf3fe;
    --sidebar-bg:#ffffff; --sidebar-border:#e5e9ef; --sidebar-item-hover:#f5f6fa;
    --sidebar-item-active:#eef0fd; --sidebar-active-text:#4361ee; --sidebar-text:#3d4764; --sidebar-icon:#6b7694;
    --topbar-bg:#eef0f4; --topbar-border:#e5e9ef;
    /* Per-chart palettes — variety BETWEEN charts, consistency WITHIN a category */
    --chart-1:#4361ee; --chart-2:#2ec4b6; --chart-3:#f4a261; --chart-4:#e63946; --chart-5:#9b5de5; --chart-6:#8d99ae;
    --chip-global:#4361ee; --chip-widget:#9b5de5; --chip-drill:#f4a261; --chip-chat:#2ec4b6;
  }
  * { font-family: var(--font-sans); }
  body { background: var(--surface); color: var(--foreground); margin:0; }
  [x-cloak]{ display:none !important; }
  .tabular-nums{ font-variant-numeric: tabular-nums; }
  @keyframes skel-pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .skel{ animation:skel-pulse 1.4s ease-in-out infinite; background:var(--border-subtle); border-radius:6px; }
  /* flash a search hit when you jump to it */
  @keyframes search-flash{0%{background:var(--primary-light);box-shadow:0 0 0 3px var(--primary-light)}100%{background:transparent;box-shadow:0 0 0 3px transparent}}
  .search-flash{ animation:search-flash 1.8s ease-out; border-radius:6px; }
  .chip-stripe-global{ box-shadow: inset 2px 0 0 var(--chip-global); }
  .chip-stripe-widget{ box-shadow: inset 2px 0 0 var(--chip-widget); }
  .chip-stripe-drill { box-shadow: inset 2px 0 0 var(--chip-drill); }
  .chip-stripe-chat  { box-shadow: inset 2px 0 0 var(--chip-chat); }
  .widget-local-stripe{ box-shadow: inset 2px 0 0 var(--chip-widget); }
  @keyframes tp-slide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .tp-track{ position:fixed; top:0; left:0; right:0; height:2px; z-index:100; overflow:hidden; pointer-events:none; }
  .tp-fill{ width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--primary),transparent); animation:tp-slide 1.1s linear infinite; }
  @keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .dot{ animation:dots 1.2s infinite both; }
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{ display:inline-block; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
  /* metric tooltip — immediate (no native title= delay); every metric explains itself here */
  .mtip{ position:fixed; z-index:90; max-width:290px; padding:8px 10px; border-radius:8px;
    background:var(--surface-elevated); border:1px solid var(--border); box-shadow:0 4px 14px rgba(0,0,0,.10);
    font-size:12px; line-height:1.45; color:var(--foreground);
    pointer-events:auto; user-select:text; -webkit-user-select:text; cursor:text; }  /* hoverable → the text can be selected & copied */
  .mtip b{ font-weight:600; }
  .mtip .src{ color:var(--muted-foreground); }
  /* rich chat answers — the Asky agent returns HTML; render it (sanitized) instead of showing tags */
  .chat-rich{ line-height:1.5; }
  .chat-rich h1,.chat-rich h2,.chat-rich h3,.chat-rich h4{ font-weight:600; margin:.5rem 0 .25rem; line-height:1.3; }
  .chat-rich h3{ font-size:.95rem; } .chat-rich h4{ font-size:.85rem; }
  .chat-rich p{ margin:.35rem 0; }
  .chat-rich ul,.chat-rich ol{ margin:.35rem 0; padding-left:1.15rem; } .chat-rich li{ margin:.12rem 0; }
  .chat-rich table{ border-collapse:collapse; width:100%; margin:.45rem 0; font-size:.78rem; }
  .chat-rich th,.chat-rich td{ border:1px solid var(--border); padding:.2rem .45rem; text-align:left; }
  .chat-rich th{ background:var(--surface); font-weight:600; }
  .chat-rich code{ background:var(--surface); padding:0 .25rem; border-radius:3px; font-size:.82em; }
  .chat-rich pre{ background:var(--surface); padding:.5rem; border-radius:6px; overflow-x:auto; }
  .chat-rich a{ color:var(--primary); text-decoration:underline; }
  .chat-rich strong,.chat-rich b{ font-weight:600; }
  .chat-rich blockquote{ border-left:3px solid var(--border); margin:.4rem 0; padding-left:.6rem; color:var(--muted-foreground); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  button:focus-visible,a:focus-visible,input:focus-visible,[role=button]:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }
</style>
</head>
<body x-data="app()" x-init="init()" x-cloak class="text-sm">

<!-- top progress -->
<div class="tp-track" x-show="loading" x-transition><div class="tp-fill"></div></div>

<!-- metric tooltip (immediate) — what it is · how it's calculated · which source -->
<div class="mtip" x-show="tip.show" x-html="tip.html" :style="{ left: tip.x+'px', top: tip.y+'px' }" @mouseenter="tipEnter()" @mouseleave="hideTip()" x-cloak></div>

<!-- ══ SIDEBAR ══ -->
<aside class="fixed left-0 top-0 h-screen z-40 bg-[var(--sidebar-bg)] border-r border-[var(--sidebar-border)] flex flex-col transition-all duration-200"
       :class="sidebarOpen ? 'w-[220px]' : 'w-[60px]'">
  <div class="min-h-[56px] flex items-center gap-2.5 px-3 py-2 border-b border-[var(--border-subtle)]">
    <!-- logo: uses APP_CONFIG.logo image when set, else the initial; click expands a collapsed sidebar -->
    <button @click="!sidebarOpen && (sidebarOpen=true)" :class="sidebarOpen?'cursor-default':'cursor-pointer'" :title="sidebarOpen?'':'Expand sidebar'"
      class="w-8 h-8 shrink-0 rounded-lg overflow-hidden bg-[var(--primary)] text-white flex items-center justify-center font-semibold">
      <template x-if="appLogo"><img :src="appLogo" :alt="appName" class="w-full h-full object-cover"></template>
      <template x-if="!appLogo"><span x-text="appInitial"></span></template>
    </button>
    <div x-show="sidebarOpen" class="min-w-0 flex-1">
      <div class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)] leading-none">Analytics</div>
      <!-- full app name; wraps to a second line instead of truncating -->
      <div class="text-sm font-semibold leading-tight break-words" x-text="appName"></div>
    </div>
  </div>
  <nav class="flex-1 overflow-y-auto py-3 px-2">
    <div x-show="sidebarOpen" class="px-3 mt-0 mb-3 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Workspace</div>
    <template x-for="s in sections" :key="s.id">
      <button @click="navigate(s.id)"
        class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors"
        :class="section===s.id ? 'bg-[var(--sidebar-item-active)] text-[var(--sidebar-active-text)]' : 'text-[var(--sidebar-text)] hover:bg-[var(--sidebar-item-hover)]'">
        <span class="shrink-0" x-html="icon(s.icon)" :class="section===s.id ? 'text-[var(--primary)]' : 'text-[var(--sidebar-icon)]'"></span>
        <span x-show="sidebarOpen" x-text="s.label" class="truncate"></span>
      </button>
    </template>
  </nav>
  <div class="border-t border-[var(--border-subtle)] p-2.5 flex items-center gap-2 text-xs text-[var(--muted-foreground)]">
    <!-- Expanded: "Powered by Ask-Y" (cube + wordmark). Collapsed: just the cube. -->
    <div x-show="sidebarOpen" class="flex items-center gap-1.5 min-w-0">
      <span class="shrink-0">Powered by</span>
      <span class="shrink-0 inline-flex" x-html="askyLogo"></span>
    </div>
    <span x-show="!sidebarOpen" class="inline-flex" x-html="askyCube" :title="'Powered by Ask-Y'"></span>
    <button @click="sidebarOpen=!sidebarOpen" :title="sidebarOpen?'Collapse sidebar':'Expand sidebar'" class="ml-auto w-7 h-7 rounded-lg flex items-center justify-center hover:bg-[var(--surface)]" x-html="sidebarOpen ? icon('collapse') : icon('expand')"></button>
  </div>
</aside>

<!-- ══ HEADER ══ -->
<header class="fixed top-0 right-0 z-30 h-[56px] flex items-center gap-3 px-4 bg-[var(--topbar-bg)] border-b border-[var(--topbar-border)] transition-all duration-200"
        :style="`left:${sidebarOpen?220:60}px;right:${chatOpen?440:0}px`">
  <h1 class="text-base font-semibold tracking-tight" x-text="currentSection().label"></h1>
  <!-- Loading indicator only. (The "data through <date>" freshness badge was removed for now.) -->
  <div class="flex items-center gap-1.5 text-xs text-[var(--muted-foreground)]" x-show="loading">
    <span class="spin w-3.5 h-3.5"></span><span>Loading…</span>
  </div>
  <div class="flex-1"></div>
  <button @click="paletteMode='search'; commandPaletteOpen=true" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[var(--surface-elevated)] border border-[var(--border)] text-sm text-[var(--placeholder)] hover:border-[var(--primary)] hover:text-[var(--foreground)] min-w-[200px]">
    <span x-html="icon('search')"></span><span class="flex-1 text-left">Search…</span><kbd class="text-[10px] px-1 py-0.5 rounded border border-[var(--border)]">⌘K</kbd>
  </button>
  <div class="w-7 h-7 rounded-full bg-[var(--primary)] text-white flex items-center justify-center text-xs font-semibold">Y</div>
</header>

<!-- ══ MAIN ══ -->
<main class="min-h-screen pt-[56px] transition-all duration-200" :style="`padding-left:${sidebarOpen?220:60}px;padding-right:${chatOpen?440:0}px`">

  <!-- Filter bar (global) -->
  <div class="sticky top-[56px] z-20 bg-[var(--surface)]/95 backdrop-blur border-b border-[var(--border)] px-6 py-2 flex flex-wrap items-center gap-2">
    <div x-show="!hideDate" class="relative">
      <div class="flex rounded-lg border border-[var(--border)] overflow-hidden">
        <template x-for="p in ['all_time','last_7d','last_30d','ytd']" :key="p">
          <button @click="setPreset(p)" class="px-3 py-1.5 text-xs font-medium border-l first:border-l-0 border-[var(--border)]"
            :class="range.preset===p ? 'bg-[var(--primary)] text-white' : 'text-[var(--foreground)] hover:bg-[var(--surface)]'" x-text="presetLabel(p)"></button>
        </template>
        <button @click="openCustomRange()" title="Pick an exact date range" class="px-3 py-1.5 text-xs font-medium border-l border-[var(--border)] flex items-center gap-1.5"
          :class="range.preset==='custom' ? 'bg-[var(--primary)] text-white' : 'text-[var(--foreground)] hover:bg-[var(--surface)]'">
          <span x-html="icon('calendar')"></span><span x-text="range.preset==='custom' ? rangeLabel() : 'Custom'"></span>
        </button>
      </div>
      <!-- Visual calendar range picker: click a start day then an end day (the range highlights),
           then Apply. Start/End fields show the current selection; the active one is outlined. -->
      <div x-show="customRangeOpen" x-cloak @click.outside="customRangeOpen=false" x-transition class="absolute left-0 top-full mt-1.5 z-40 w-72 p-3 rounded-xl bg-[var(--surface-elevated)] border border-[var(--border)] shadow-lg">
        <div class="flex items-stretch gap-2 mb-3">
          <div class="flex-1 px-2.5 py-1.5 rounded-lg border" :class="crPicking==='start' ? 'border-[var(--primary)] ring-1 ring-[var(--primary)]' : 'border-[var(--border)]'">
            <div class="text-[9px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Start date</div>
            <div class="text-sm tabular-nums" x-text="customFrom ? crLabel(customFrom) : '—'"></div>
          </div>
          <div class="flex items-center text-[var(--muted-foreground)]">–</div>
          <div class="flex-1 px-2.5 py-1.5 rounded-lg border" :class="crPicking==='end' ? 'border-[var(--primary)] ring-1 ring-[var(--primary)]' : 'border-[var(--border)]'">
            <div class="text-[9px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">End date</div>
            <div class="text-sm tabular-nums" x-text="customTo ? crLabel(customTo) : '—'"></div>
          </div>
        </div>
        <div class="flex items-center justify-between mb-1">
          <button @click="crPrev()" class="w-7 h-7 rounded-lg flex items-center justify-center text-[var(--muted-foreground)] hover:bg-[var(--surface)] hover:text-[var(--foreground)]"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
          <span class="text-sm font-semibold" x-text="crTitle()"></span>
          <button @click="crNext()" class="w-7 h-7 rounded-lg flex items-center justify-center text-[var(--muted-foreground)] hover:bg-[var(--surface)] hover:text-[var(--foreground)]"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
        <div class="grid grid-cols-7 text-center text-[10px] font-medium text-[var(--muted-foreground)] mb-1">
          <template x-for="(d,i) in ['S','M','T','W','T','F','S']" :key="i"><span x-text="d"></span></template>
        </div>
        <div class="grid grid-cols-7 gap-y-0.5 text-center">
          <template x-for="(cell,i) in crGrid()" :key="i">
            <div class="py-0.5 flex items-center justify-center" :class="crInRange(cell.iso) ? 'bg-[var(--primary-light)]' : ''">
              <template x-if="cell.iso">
                <button @click="crPick(cell.iso)"
                  class="w-8 h-8 rounded-full text-xs tabular-nums flex items-center justify-center transition-colors"
                  :class="(crIsStart(cell.iso)||crIsEnd(cell.iso)) ? 'bg-[var(--primary)] text-white font-semibold' : (crInRange(cell.iso) ? 'text-[var(--primary)]' : 'hover:bg-[var(--surface)]')"
                  x-text="cell.day"></button>
              </template>
            </div>
          </template>
        </div>
        <div class="flex items-center justify-end gap-1 mt-3 pt-2 border-t border-[var(--border-subtle)]">
          <button @click="customRangeOpen=false" class="px-3 py-1.5 text-xs font-medium rounded-lg text-[var(--muted-foreground)] hover:bg-[var(--surface)]">Cancel</button>
          <button @click="applyCustomRange()" :disabled="!customFrom||!customTo" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-[var(--primary)] hover:bg-[var(--primary-light)] disabled:opacity-40 disabled:cursor-not-allowed">Apply</button>
        </div>
      </div>
    </div>
    <div x-show="!hideDate" class="w-px h-5 bg-[var(--border)]"></div>
    <template x-for="s in pinnedGlobalSlicers()" :key="s.id">
      <button @click="toggleSlicer(s.id,'global')" class="px-3 py-1.5 rounded-lg border text-xs font-medium"
        :class="isSlicerOpen(s.id) ? 'border-[var(--primary)] text-[var(--primary)] bg-[var(--primary-light)]' : 'border-[var(--border)] hover:border-[var(--primary)]'" x-text="s.label"></button>
    </template>
    <button @click="paletteMode='filter'; commandPaletteOpen=true" class="px-3 py-1.5 rounded-lg border border-dashed border-[var(--border)] text-xs text-[var(--muted-foreground)] hover:border-[var(--primary)] hover:text-[var(--primary)]">+ Add filter</button>
    <div class="flex-1"></div>
    <button x-show="activeFilterCount()>0" @click="clearAll()" class="text-xs px-2.5 py-1.5 rounded-lg text-[var(--negative)] hover:bg-[var(--negative-light)]" x-text="`Clear all (${activeFilterCount()})`"></button>
    <button @click="resetAll()" title="Reset filters and date range to defaults" class="text-xs px-2.5 py-1.5 rounded-lg border border-[var(--border)] hover:border-[var(--primary)]">Reset</button>
  </div>

  <!-- Active filter chips -->
  <div x-show="allChips().length" class="px-6 pt-3 flex flex-wrap items-center gap-2">
    <span class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Filters</span>
    <template x-for="c in allChips()" :key="c.scope+c.field">
      <span class="inline-flex items-center gap-1 pl-2.5 pr-1 py-1 rounded-lg bg-[var(--surface-elevated)] border border-[var(--border)] text-xs"
            :class="'chip-stripe-'+c.scope">
        <span x-text="c.text"></span>
        <!-- include/exclude toggle (global filters): = includes, ≠ excludes -->
        <button x-show="c.scope==='global'" @click="toggleChipOp(c)" :title="c.op==='not_in' ? 'Excluding these — click to include' : 'Including these — click to exclude'"
          class="w-5 h-4 rounded text-[11px] font-semibold flex items-center justify-center hover:bg-[var(--surface)]"
          :class="c.op==='not_in' ? 'text-[var(--negative)]' : 'text-[var(--muted-foreground)]'" x-text="c.op==='not_in' ? '≠' : '='"></button>
        <button @click="removeFilter(c.scope,c.field)" class="w-4 h-4 rounded flex items-center justify-center hover:bg-[var(--surface)]" x-html="icon('x')"></button>
      </span>
    </template>
  </div>

  <!-- error banner -->
  <div x-show="error" class="mx-6 mt-4 p-3 rounded-lg bg-[var(--negative-light)] border border-[var(--negative)] text-sm text-[var(--negative)] flex items-start gap-2">
    <span x-html="icon('warning')"></span><span class="flex-1" x-text="error"></span>
    <button @click="error=null" x-html="icon('x')"></button>
  </div>

  <!-- ══ GENERIC SECTION RENDERER — one block renders every tab from config ══ -->
  <template x-for="sec in sections" :key="sec.id">
    <div x-show="section===sec.id" :data-sec-search="sec.id" class="px-6 pt-5 pb-10 space-y-6">

      <!-- subtitle: per-tab "what this measures + how broken down" -->
      <p class="text-sm text-[var(--muted-foreground)] -mt-1" x-text="sec.subtitle"></p>

      <!-- KPI strip (every layout that declares kpis) -->
      <div x-show="sec.kpis && sec.kpis.length" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <template x-for="(k,ki) in (sec.kpis||[])" :key="ki">
          <div class="bg-[var(--surface-elevated)] border border-[var(--border)] rounded-xl shadow-sm p-4 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]" x-text="k.label"></span>
              <button class="w-6 h-6 rounded flex items-center justify-center text-[var(--muted-foreground)] hover:bg-[var(--surface)] hover:text-[var(--primary)]" @mouseenter="showTip($event, metricTipHtml(k.label, kpiTooltip(k), k.source))" @mousemove="moveTip($event)" @mouseleave="hideTip()" x-html="icon('info')"></button>
            </div>
            <div class="flex items-end gap-2">
              <span class="text-2xl font-bold tabular-nums cursor-help" @mouseenter="k._exact && showTip($event, metricTipHtml(k.label, 'Exact: '+k._exact, k.source))" @mousemove="moveTip($event)" @mouseleave="hideTip()" x-text="k._val ?? '—'"></span>
              <span x-show="k._delta!=null" class="flex items-center gap-0.5 text-xs font-semibold mb-1 tabular-nums cursor-help"
                    :class="deltaGood(k) ? 'text-[var(--positive)]' : 'text-[var(--negative)]'"
                    @mouseenter="showTip($event, deltaTipHtml(k))" @mousemove="moveTip($event)" @mouseleave="hideTip()">
                <span x-html="(k._delta>=0)?icon('arrowup'):icon('arrowdown')"></span><span x-text="Math.abs(k._delta||0).toFixed(1)+'%'"></span>
              </span>
            </div>
            <div class="h-9 -mx-1" :id="`spark-${sec.id}-${ki}`"></div>
          </div>
        </template>
      </div>

      <!-- @MODULE:LAYOUTS -->
      <!-- charts (kpi-grid hero + breakdown-grid + comparison small-multiples) -->
      <template x-if="sec.charts && sec.charts.length">
        <div :class="['breakdown-grid','comparison'].includes(sec.layout) ? 'grid grid-cols-1 lg:grid-cols-2 gap-4' : 'space-y-6'">
          <template x-for="(c,ci) in sec.charts" :key="ci">
            <section class="bg-[var(--surface-elevated)] border border-[var(--border)] rounded-xl shadow-sm p-4">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="text-sm font-semibold flex items-center gap-2">
                    <span x-text="c.title"></span>
                    <span x-show="c._unfiltered" @mouseenter="showTip($event, 'Time charts show about one granularity level of context around the selected range — a day breakdown spans the month, a week breakdown ~3 months, a month breakdown the full year — so the trend is never just a point or two. Every other filter still applies.')" @mousemove="moveTip($event)" @mouseleave="hideTip()"
                      class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-[var(--primary-light)] text-[var(--primary)] cursor-help whitespace-nowrap">+ context</span>
                    <template x-for="f in (c._skippedFilters||[])" :key="f">
                      <span @mouseenter="showTip($event, 'The '+f+' filter selects a single '+f+' — applying it here would collapse this breakdown to one bar. Showing all '+f+' values instead; the time filter and every other filter still apply.')" @mousemove="moveTip($event)" @mouseleave="hideTip()"
                        class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-[var(--primary-light)] text-[var(--primary)] cursor-help whitespace-nowrap" x-text="'all '+pfLabel(f).toLowerCase().replace(/s?$/,'s')"></span>
                    </template>
                  </h3>
                  <p class="text-xs text-[var(--muted-foreground)]" x-text="chartSubtitle(c)"></p>
                </div>
                <button class="w-7 h-7 rounded-lg flex items-center justify-center text-[var(--muted-foreground)] hover:bg-[var(--surface)] hover:text-[var(--primary)]" @mouseenter="showTip($event, metricTipHtml(c.title, chartTip(c), c.source))" @mousemove="moveTip($event)" @mouseleave="hideTip()" x-html="icon('info')"></button>
              </div>
              <div :id="`chart-${sec.id}-${ci}`" :style="`height:${ci===0 && sec.layout!=='breakdown-grid' ? 340 : 260}px`"></div>
              <!-- empty state -->
              <div x-show="(c._data||[]).length===0 && !loading" class="text-center py-8 text-sm text-[var(--muted-foreground)]">No results match the selected filters.</div>
            </section>
          </template>
        </div>
      </template>

      <!-- data-table layout: rich typed table + section-scoped select filters -->
      <template x-if="sec.table">
        <section class="bg-[var(--surface-elevated)] border border-[var(--border)] rounded-xl shadow-sm p-4">
          <div class="flex flex-wrap items-center gap-2 mb-4">
            <h3 class="text-sm font-semibold mr-2" x-text="sec.tableTitle || 'Rows'"></h3>
            <!-- Per-column sort + filter live in each column header (below). A "Clear filters" chip shows
                 here when any column filter is active. -->
            <button x-show="tableFilterCount(sec)>0" @click="clearAllColFilters(sec)"
              class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-[var(--negative)] hover:bg-[var(--negative-light)]"
              x-text="`Clear filters (${tableFilterCount(sec)})`"></button>
            <div class="flex-1"></div>
            <!-- Generic "Copy" menu — every table that is NOT a performance table (no copySummary) gets it.
                 "Copy as table" → a real table on the clipboard (rich HTML for Docs/Slack/email + TSV for
                 Sheets/Excel). "Copy as image" → a PNG of the table (canvas-drawn, no external libs).
                 Performance tables instead get the richer "Copy Performance Summary" (marker below). -->
            <template x-if="sec.table && !sec.table.copySummary">
              <div class="relative" x-data="{copyOpen:false}" @click.outside="copyOpen=false">
                <button @click="copyOpen=!copyOpen"
                  title="Copy this table — as a real table (Docs/Slack/Sheets) or as an image"
                  class="px-3 py-1.5 rounded-lg border border-[var(--border)] text-xs font-medium flex items-center gap-1.5 hover:border-[var(--primary)] hover:text-[var(--primary)]">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                  <span>Copy</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div x-show="copyOpen" x-transition @click="copyOpen=false" class="absolute right-0 mt-1 z-30 w-44 rounded-lg border border-[var(--border)] bg-[var(--surface-elevated)] shadow-md p-1">
                  <button @click="copyTableView(sec)" class="w-full text-left px-2.5 py-1.5 rounded text-xs hover:bg-[var(--surface)] flex items-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>
                    <span>Copy as table</span>
                  </button>
                  <button @click="copyTableImage(sec)" class="w-full text-left px-2.5 py-1.5 rounded text-xs hover:bg-[var(--surface)] flex items-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>
                    <span>Copy as image</span>
                  </button>
                </div>
              </div>
            </template>
            <!-- @MODULE:TABLEACTIONS -->
            <span class="text-xs text-[var(--muted-foreground)] tabular-nums" x-text="tableRowCount(sec)+' rows'"></span>
          </div>
          <!-- All rows are rendered; this box scrolls vertically (and horizontally) with a sticky header. -->
          <div class="overflow-auto max-h-[65vh]">
            <table class="w-full text-sm">
              <thead class="sticky top-0 z-10 bg-[var(--surface-elevated)]">
                <tr class="border-b border-[var(--border)]">
                  <!-- leading expander column, only when this table opts into per-row detail -->
                  <template x-if="sec.table.rowDetail"><th class="w-8 py-2.5 px-2"></th></template>
                  <template x-for="col in sec.table.columns" :key="col.key">
                    <th class="relative text-left py-2.5 px-3 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)] select-none">
                      <span class="inline-flex items-center gap-1">
                        <!-- label doubles as the sort toggle -->
                        <span @click="col.sortable!==false && sortBy(sec.id,col.key)" :class="col.sortable!==false ? 'cursor-pointer hover:text-[var(--foreground)]' : ''" x-text="col.label"></span>
                        <!-- SORT control on every sortable column (always visible so it's clearly clickable) -->
                        <button x-show="col.sortable!==false && col.label" @click="sortBy(sec.id,col.key)" title="Sort by this column"
                          class="w-4 h-4 flex items-center justify-center leading-none">
                          <span x-show="!(sortState[sec.id] && sortState[sec.id].key===col.key)" class="opacity-30 hover:opacity-70 text-[11px]">⇅</span>
                          <span x-show="sortState[sec.id] && sortState[sec.id].key===col.key" class="text-[var(--primary)] text-[10px]" x-text="(sortState[sec.id] && sortState[sec.id].dir==='asc')?'▲':'▼'"></span>
                        </button>
                        <!-- FILTER control on every filterable column -->
                        <button x-show="colFilterable(col)" @click.stop="colFilterOpen = (colFilterOpen===sec.id+'::'+col.key ? null : sec.id+'::'+col.key)" title="Filter this column"
                          class="w-4 h-4 flex items-center justify-center" :class="colFilterActive(sec,col) ? 'text-[var(--primary)]' : 'opacity-30 hover:opacity-70'">
                          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
                        </button>
                        <button x-show="col.label" class="opacity-40 hover:opacity-100 hover:text-[var(--primary)]" @mouseenter="showTip($event, metricTipHtml(col.label, columnTip(col), col.source))" @mousemove="moveTip($event)" @mouseleave="hideTip()" x-html="icon('info')"></button>
                      </span>
                      <!-- per-column filter popover: value checklist (categorical) or min/max (numeric) -->
                      <template x-if="colFilterable(col)">
                        <div x-show="colFilterOpen===sec.id+'::'+col.key" x-cloak @click.outside="colFilterOpen===sec.id+'::'+col.key && (colFilterOpen=null)" x-transition
                          class="absolute left-0 top-full mt-1 z-40 w-56 rounded-lg border border-[var(--border)] bg-[var(--surface-elevated)] shadow-md p-2 normal-case tracking-normal font-normal text-xs text-[var(--foreground)]" x-data="{cq:''}">
                          <!-- categorical: pick one or more values -->
                          <template x-if="colFilterKind(col)==='values'">
                            <div>
                              <input x-show="colValues(sec,col).length>10" x-model="cq" type="search" placeholder="Search values…" class="w-full mb-1.5 px-2 py-1 rounded border border-[var(--border)] outline-none focus:border-[var(--primary)]">
                              <!-- Select all / Clear all -->
                              <button @click="toggleColAll(sec,col)" class="w-full flex items-center gap-2 px-1.5 py-1 mb-1 pb-1.5 rounded text-left font-medium hover:bg-[var(--surface)] border-b border-[var(--border-subtle)]">
                                <span class="w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0" :class="colAllSelected(sec,col) ? 'bg-[var(--primary)] border-[var(--primary)] text-white' : 'border-[var(--border)]'"><span x-show="colAllSelected(sec,col)" class="text-[9px]">✓</span></span>
                                <span x-text="colAllSelected(sec,col) ? 'Clear all' : 'Select all'"></span>
                              </button>
                              <div class="flex flex-col gap-0.5 max-h-52 overflow-auto">
                                <template x-for="v in colValues(sec,col).filter(x=>!cq||(''+x).toLowerCase().includes(cq.toLowerCase()))" :key="v">
                                  <button @click="toggleColValue(sec,col,v)" class="flex items-center gap-2 px-1.5 py-1 rounded text-left hover:bg-[var(--surface)]">
                                    <span class="w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0" :class="colValueSelected(sec,col,v) ? 'bg-[var(--primary)] border-[var(--primary)] text-white' : 'border-[var(--border)]'"><span x-show="colValueSelected(sec,col,v)" class="text-[9px]">✓</span></span>
                                    <span class="truncate" x-text="v"></span>
                                  </button>
                                </template>
                              </div>
                            </div>
                          </template>
                          <!-- numeric: min / max range -->
                          <template x-if="colFilterKind(col)==='range'">
                            <div class="flex items-center gap-1.5">
                              <input type="number" placeholder="Min" :value="colRange(sec,col).min" @input="setColRange(sec,col,'min',$event.target.value)" class="w-full px-2 py-1 rounded border border-[var(--border)] outline-none focus:border-[var(--primary)] tabular-nums">
                              <span class="text-[var(--muted-foreground)]">–</span>
                              <input type="number" placeholder="Max" :value="colRange(sec,col).max" @input="setColRange(sec,col,'max',$event.target.value)" class="w-full px-2 py-1 rounded border border-[var(--border)] outline-none focus:border-[var(--primary)] tabular-nums">
                            </div>
                          </template>
                          <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-[var(--border-subtle)]">
                            <button @click="clearColFilter(sec,col)" class="text-[var(--muted-foreground)] hover:text-[var(--negative)]">Clear</button>
                            <button @click="colFilterOpen=null" class="text-[var(--primary)] font-medium">Done</button>
                          </div>
                        </div>
                      </template>
                    </th>
                  </template>
                </tr>
              </thead>
              <!-- One x-for over a flat display model (tableDisplay): group-header rows, data rows, and
                   expanded per-row detail rows are all emitted as <tr> items so a single template can
                   render them. Grouping (sec.table.sectionGroupBy) and detail (sec.table.rowDetail) are
                   both opt-in per section; with neither set this renders exactly as before. -->
              <tbody>
                <template x-for="item in tableDisplay(sec)" :key="item.key">
                  <tr :class="item.type==='group' ? 'bg-[var(--surface)] border-y border-[var(--border)]' : item.type==='totals' ? 'bg-[var(--surface)] border-y-2 border-[var(--border)] font-semibold' : (item.type==='detail' ? '' : 'border-b border-[var(--border-subtle)] hover:bg-[var(--sidebar-item-hover)]')">
                    <!-- platform section header -->
                    <template x-if="item.type==='group'">
                      <td :colspan="colCount(sec)" class="py-2 px-3">
                        <div class="flex items-center gap-2">
                          <span class="text-[11px] font-semibold uppercase tracking-wider text-[var(--foreground)]" x-text="item.label"></span>
                          <span class="text-[10px] text-[var(--muted-foreground)] tabular-nums" x-text="item.count+(item.count===1?' campaign':' campaigns')"></span>
                          <span class="flex-1"></span>
                          <span class="text-[11px] text-[var(--muted-foreground)] tabular-nums" x-text="'Spend '+item.spendLabel"></span>
                        </div>
                      </td>
                    </template>
                    <!-- expander chevron (only on detail-enabled tables) -->
                    <template x-if="item.type==='row' && sec.table.rowDetail">
                      <td class="w-8 py-2.5 px-2 align-middle cursor-pointer text-[var(--muted-foreground)] hover:text-[var(--foreground)]" @click="toggleRow(sec,item.row)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-150" :class="isRowExpanded(sec,item.row)?'rotate-90':''"><polyline points="9 6 15 12 9 18"/></svg>
                      </td>
                    </template>
                    <!-- data cells -->
                    <template x-if="item.type==='row'">
                      <template x-for="col in sec.table.columns" :key="col.key">
                        <td class="py-2.5 px-3" :class="sec.table.rowDetail?'cursor-pointer':''" @click="sec.table.rowDetail && col.type!=='image' && toggleRow(sec,item.row)" x-html="renderCell(col,item.row)"></td>
                      </template>
                    </template>
                    <!-- totals row: leading empty cell (detail tables) + one cell per column -->
                    <template x-if="item.type==='totals' && sec.table.rowDetail"><td class="py-2.5 px-2"></td></template>
                    <template x-if="item.type==='totals'">
                      <template x-for="col in sec.table.columns" :key="col.key">
                        <td class="py-2.5 px-3 tabular-nums" x-text="item.cells[col.key]"></td>
                      </template>
                    </template>
                    <!-- expanded per-day breakdown -->
                    <template x-if="item.type==='detail'">
                      <td :colspan="colCount(sec)" class="p-0 bg-[var(--surface)]">
                        <div class="px-3 pb-3 pt-1" x-transition.opacity>
                          <div class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5 mt-1" x-text="'Daily breakdown · '+rangeLabel()"></div>
                          <table class="w-full text-xs border border-[var(--border-subtle)] rounded-lg overflow-hidden">
                            <thead><tr class="bg-[var(--surface-elevated)] border-b border-[var(--border-subtle)]">
                              <template x-for="h in dailyColumns()" :key="h.key">
                                <th class="py-1.5 px-2.5 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]" :class="h.type==='date'?'text-left':'text-right'" x-text="h.label"></th>
                              </template>
                            </tr></thead>
                            <tbody>
                              <template x-for="(d,di) in dailyRows(sec,item.row)" :key="di">
                                <tr class="border-b border-[var(--border-subtle)] last:border-0">
                                  <template x-for="h in dailyColumns()" :key="h.key">
                                    <td class="py-1.5 px-2.5 tabular-nums" :class="h.type==='date'?'text-left text-[var(--muted-foreground)]':'text-right'" x-html="renderCell(h,d)"></td>
                                  </template>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </td>
                    </template>
                  </tr>
                </template>
                <tr x-show="tableRowCount(sec)===0">
                  <td :colspan="colCount(sec)" class="text-center py-8 text-[var(--muted-foreground)]">No results match the selected filters.</td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- footer — all rows are shown above (scroll the box); this just states the count -->
          <div x-show="tableRowCount(sec)>0" class="flex items-center gap-2 mt-3 pt-3 border-t border-[var(--border-subtle)]">
            <span class="text-xs text-[var(--muted-foreground)] tabular-nums" x-text="'Showing '+tableShownLabel(sec)"></span>
          </div>
        </section>
      </template>

      <!-- user widgets + New widget (every section) -->
      <div x-show="widgets.length" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <template x-for="w in widgets" :key="w.id">
          <section class="bg-[var(--surface-elevated)] border border-[var(--border)] rounded-xl shadow-sm p-4" :class="w.widgetFilters && w.widgetFilters.length ? 'widget-local-stripe':''">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-semibold" x-text="w.title || w.label"></h3>
              <button @click="removeWidget(w.id)" class="w-6 h-6 rounded flex items-center justify-center text-[var(--muted-foreground)] hover:bg-[var(--surface)]" x-html="icon('x')"></button>
            </div>
            <div x-html="renderWidgetBody(w)"></div>
          </section>
        </template>
      </div>
      <button @click="openWidgetBuilder()" class="text-xs px-3 py-2 rounded-lg border border-dashed border-[var(--border)] text-[var(--muted-foreground)] hover:border-[var(--primary)] hover:text-[var(--primary)]">+ New widget</button>
    </div>
  </template>
</main>

<!-- ══ SLICER PANEL (right) ══ -->
<div x-show="openSlicers.length" x-cloak class="fixed right-0 top-[56px] bottom-0 w-[320px] z-30 bg-[var(--surface-elevated)] border-l border-[var(--border)] flex flex-col">
  <div class="h-11 px-4 flex items-center justify-between border-b border-[var(--border)] text-xs font-semibold">
    <span x-text="`Filters · ${openSlicers.length}`"></span>
    <button @click="openSlicers=[]" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Close all</button>
  </div>
  <div class="flex-1 overflow-y-auto">
    <template x-for="os in openSlicers" :key="os.id">
      <div class="border-b border-[var(--border-subtle)]" x-data="{q:''}">
        <div class="px-4 py-2.5 flex items-center gap-2">
          <span class="text-xs font-semibold flex-1 truncate" x-text="slicerById(os.id).label"></span>
          <!-- include/exclude: a small toggle next to the name (chip slicers only); values below are the filter -->
          <button x-show="os.id!=='date_range'" @click="setSlicerMode(os.id, slicerMode(os.id)==='not_in'?'in':'not_in')"
            :title="slicerMode(os.id)==='not_in' ? 'Excluding the selected values — click to include instead' : 'Including the selected values — click to exclude instead'"
            class="text-[10px] font-semibold px-1.5 py-0.5 rounded border shrink-0"
            :class="slicerMode(os.id)==='not_in' ? 'border-[var(--negative)] text-[var(--negative)] bg-[var(--negative-light)]' : 'border-[var(--border)] text-[var(--muted-foreground)] hover:border-[var(--primary)]'"
            x-text="slicerMode(os.id)==='not_in' ? 'Exclude' : 'Include'"></button>
          <button @click="closeSlicer(os.id)" x-html="icon('x')" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)] shrink-0"></button>
        </div>
        <!-- date slicer -->
        <div x-show="os.id==='date_range'" class="px-4 pb-3 grid grid-cols-2 gap-1.5">
          <template x-for="p in ['all_time','last_7d','last_30d','ytd']" :key="p">
            <button @click="setPreset(p)" class="px-2 py-1.5 rounded text-[11px] border"
              :class="range.preset===p ? 'border-[var(--primary)] text-[var(--primary)] bg-[var(--primary-light)]' : 'border-[var(--border)] hover:border-[var(--primary)]'" x-text="presetLabel(p)"></button>
          </template>
        </div>
        <!-- chip slicer -->
        <div x-show="os.id!=='date_range'" class="px-4 pb-3">
          <!-- pick the values to filter by; the Include/Exclude toggle next to the name decides keep-vs-drop -->
          <input x-show="(slicerValues[os.id]||[]).length>12" x-model="q" type="search" placeholder="Filter values…" class="w-full mb-2 px-2 py-1.5 text-xs rounded border border-[var(--border)] outline-none focus:border-[var(--primary)]">
          <div class="flex flex-col gap-1 max-h-52 overflow-auto">
            <template x-for="v in (slicerValues[os.id]||[]).filter(x=>!q||(''+x).toLowerCase().includes(q.toLowerCase()))" :key="v">
              <button @click="toggleSlicerValue(os.id,v)" class="flex items-center gap-2 px-2 py-1.5 rounded text-xs text-left hover:bg-[var(--surface)]">
                <span class="w-3.5 h-3.5 rounded border flex items-center justify-center"
                      :class="isValueSelected(os.id,v) ? 'bg-[var(--primary)] border-[var(--primary)] text-white' : 'border-[var(--border)]'">
                  <span x-show="isValueSelected(os.id,v)" class="text-[9px]">✓</span></span>
                <span x-text="v"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- ══ COMMAND PALETTE ══ -->
<div x-show="commandPaletteOpen" x-cloak @keydown.escape.window="commandPaletteOpen=false" class="fixed inset-0 z-50 flex items-start justify-center pt-32 bg-black/30" :style="{ paddingRight: (chatOpen?440:0)+'px' }" @click.self="commandPaletteOpen=false">
  <div class="w-[480px] rounded-xl bg-[var(--surface-elevated)] border border-[var(--border)] shadow-md overflow-hidden" x-data="{q:''}">
    <div class="flex items-center gap-2 border-b border-[var(--border)] px-3">
      <span x-html="icon('search')" class="text-[var(--muted-foreground)]"></span>
      <input x-model="q" x-ref="pal" type="text" :placeholder="paletteMode==='filter' ? 'Add a filter…' : 'Search all tabs…'" class="flex-1 py-3 text-sm outline-none bg-transparent" x-init="$nextTick(()=>$refs.pal.focus())">
      <button @click="commandPaletteOpen=false" title="Close" class="w-7 h-7 rounded-lg flex items-center justify-center text-[var(--muted-foreground)] hover:bg-[var(--surface)]" x-html="icon('x')"></button>
    </div>
    <div class="max-h-80 overflow-auto p-1">
      <!-- FILTER MODE — opened from "+ Add filter": only lets you add a filter -->
      <template x-if="paletteMode==='filter'">
        <div>
          <template x-if="paletteSlicers(q).length">
            <div>
              <div class="px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Add a filter</div>
              <template x-for="s in paletteSlicers(q)" :key="'fil-'+s.id">
                <button @click="toggleSlicer(s.id,'global'); commandPaletteOpen=false" class="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-[var(--surface)] flex items-center gap-2">
                  <span x-html="icon('filter')" class="text-[var(--muted-foreground)]"></span><span x-text="'Filter by '+s.label"></span>
                </button>
              </template>
            </div>
          </template>
          <div x-show="q && !paletteSlicers(q).length" class="px-3 py-6 text-center text-sm text-[var(--muted-foreground)]">No filter matches “<span x-text="q"></span>”.</div>
        </div>
      </template>
      <!-- SEARCH MODE — opened from the top-right Search: full-text search across every tab -->
      <template x-if="paletteMode==='search'">
        <div>
          <template x-if="q && searchApp(q).length">
            <div>
              <div class="px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Results — click to jump to it</div>
              <template x-for="m in searchApp(q)" :key="m.key">
                <button @click="goToHit(m,q)" class="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-[var(--surface)] flex items-start gap-2">
                  <span x-html="icon(m.icon)" class="text-[var(--muted-foreground)] mt-0.5 shrink-0"></span>
                  <span class="min-w-0"><span class="text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]" x-text="m.label"></span><span class="block text-xs text-[var(--foreground)] truncate" x-text="m.snippet"></span></span>
                </button>
              </template>
            </div>
          </template>
          <div x-show="!q" class="px-3 py-6 text-center text-sm text-[var(--muted-foreground)]">Type any text to search across the whole app…</div>
          <div x-show="q && !searchApp(q).length" class="px-3 py-6 text-center text-sm text-[var(--muted-foreground)]">Nothing in the app matches “<span x-text="q"></span>”.</div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ══ WIDGET BUILDER — Title · Metric · Breakdown · Chart type · live Preview ══ -->

<script>
/* ══════════════════════════ HELPERS ══════════════════════════ */
/* ── connection layer (see connections/CONNECTIONS.md) — slug-prefixed base, cookie auth (Mode 2) ── */
function apiBase(){ return '/' + (APP_CONFIG.appSlug || '') + '/api'; }   // NOT bare /api — that drops the session cookie
function wsId(){ return APP_CONFIG.workspaceId; }
function projId(){ return APP_CONFIG.projectId; }
function apiHeaders(extra){ return Object.assign({ 'Accept':'application/json', 'Content-Type':'application/json', 'X-Workspace-Id':wsId() }, extra||{}); }
function safeGet(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function safeSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
// ── chat answer rendering ── the Asky agent returns HTML; render a SANITIZED subset so it shows as a
// real heading/table/list/bold instead of raw tags. Plain-text answers get newline→<br>. XSS-safe:
// DOMParser doesn't execute scripts, and we whitelist tags + drop all attributes (except safe <a href>).
const _CHAT_TAGS=new Set(['H1','H2','H3','H4','H5','H6','P','BR','HR','STRONG','B','EM','I','U','S','UL','OL','LI','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','CODE','PRE','BLOCKQUOTE','SPAN','DIV','A']);
function sanitizeChatHtml(html){
  const doc=new DOMParser().parseFromString(String(html),'text/html');
  (function walk(node){
    for(const n of [...node.childNodes]){
      if(n.nodeType===1){
        if(/^(SCRIPT|STYLE|NOSCRIPT|IFRAME|OBJECT|EMBED|TEMPLATE|LINK|META)$/.test(n.tagName)){ n.remove(); continue; }  // drop entirely (incl. text)
        if(!_CHAT_TAGS.has(n.tagName)){ n.replaceWith(document.createTextNode(n.textContent||'')); continue; }
        for(const a of [...n.attributes]){
          const nm=a.name.toLowerCase();
          if(n.tagName==='A' && nm==='href' && /^(https?:|mailto:|\/)/i.test(a.value)) continue;
          n.removeAttribute(a.name);
        }
        if(n.tagName==='A'){ n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer'); }
        walk(n);
      } else if(n.nodeType===8){ n.remove(); }   // strip comments
    }
  })(doc.body);
  return doc.body.innerHTML;
}
function renderChatHtml(text){
  text=(text==null?'':String(text));
  if(/<[a-z][\s\S]*?>/i.test(text)) return sanitizeChatHtml(text);          // looks like HTML → sanitize + render
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');  // plain → escape + line breaks
}
function chartColor(n){ return cssVar('--chart-'+(((n-1)%6)+1)); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function escapeIdent(s){ return String(s).replace(/[^a-zA-Z0-9_]/g,''); }
function escapeSqlLiteral(v){ return String(v).replace(/'/g,"''"); }

/* ── Number & date formatting policy (decide once per metric, apply everywhere) ──
   Decimal precision scales with the SHOWN mantissa (the leading number before any K/M/%/x):
   a mantissa with >2 integer digits (≥100) shows 1 decimal; ≤2 digits (<100) shows 2 decimals.
   So $6,352.89 → $6,352.9  ·  2.6K → 2.58K  ·  2.3% → 2.31%. Trailing zeros are trimmed. */
function smartDecimals(mantissa){ return Math.abs(mantissa) >= 100 ? 1 : 2; }
function trimZeros(s){ return s.indexOf('.')>=0 ? s.replace(/\.?0+$/,'') : s; }
function smartFixed(mantissa){ return trimZeros(mantissa.toFixed(smartDecimals(mantissa))); }        // "2.58", "6352.9", "260"
function smartMoney(n){ const d=smartDecimals(n); return trimZeros(new Intl.NumberFormat('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)); } // grouped + smart decimals
function formatExact(n){ return new Intl.NumberFormat('en-US').format(Math.round(n)); }
function formatAbbrev(n){ const a=Math.abs(n);
  if(a>=1e9) return smartFixed(n/1e9)+'B';
  if(a>=1e6) return smartFixed(n/1e6)+'M';
  if(a>=1e3) return smartFixed(n/1e3)+'K';
  return smartFixed(n); }
function fmt(kind, n){ // returns {label (abbreviated), exact}
  n=+n||0;
  switch(kind){
    case 'currency':  return { label:'$'+formatAbbrev(n), exact:'$'+smartMoney(n) };
    case 'count':     return { label:formatAbbrev(n), exact:formatExact(n) };
    case 'percent':   return { label:smartFixed(n*100)+'%', exact:smartFixed(n*100)+'%' };           // never abbreviated
    case 'ratio':     return { label:smartFixed(n)+'x', exact:smartFixed(n)+'x' };                    // never abbreviated
    case 'perunit':   return { label:'$'+smartFixed(n), exact:'$'+smartFixed(n) };                    // never abbreviated
    case 'integer':   return { label:formatAbbrev(n), exact:formatExact(n) };
    default:          return { label:formatAbbrev(n), exact:formatExact(n) };
  }
}
function fmtCell(type,v){
  if(v==null||v==='') return '—';
  if(type==='currency')return fmt('currency',v).exact;   // tables show EXACT
  if(type==='percent') return fmt('percent',v).label;
  if(type==='ratio')   return fmt('ratio',v).label;
  if(type==='perunit') return fmt('perunit',v).label;
  if(type==='number')  return fmt('count',v).exact;
  if(type==='date')    return formatDate(v);
  return v;
}
function formatDate(v){ try{ const d=new Date(v); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return v; } }

/* ── Table connections: POST /<slug>/api/Data/getModelView (contract per connections/CONNECTIONS.md) ── */
async function queryModel(modelId, sql, retries){
  retries = retries==null?12:retries;
  for(let attempt=0;;attempt++){
    const r = await fetch(`${apiBase()}/Data/getModelView`, { method:'POST', credentials:'include', headers:apiHeaders(),
      body:JSON.stringify({ workspaceId:wsId(), projectId:projId(), modelId, query:sql }) });
    let j={}; try{ j=await r.json(); }catch(e){}
    const code=j.errorCode||j.code;
    if((code==='WAREHOUSE_COLD_START' || j.retryable) && attempt<retries){       // the one place that retries (cold start)
      await new Promise(s=>setTimeout(s, Math.min(((j.retryAfterSeconds)||5)*1000, 10000))); continue;
    }
    if(!r.ok || j.error || j.Success===false) throw new Error(j.error || j.errorMessage || ('HTTP '+r.status));
    const D=j.Data||j.data;                                                       // mixed-case defensively
    if(D && D.colSchema){ const cols=D.colSchema.map(c=>c.name); return (D.data||[]).map(row=>Object.fromEntries(cols.map((c,i)=>[c,row[i]]))); }
    return j.rows || D || [];
  }
}
/* ── API gateway helpers: /<slug>/api/gw/... — writes encode params in the query string, no body ── */
function gwBase(){ return apiBase()+'/gw'; }
function providerError(j){ return (j && (j.error_user_msg||j.error_user_title||j.message||j.errorMessage||j.ErrorMessage||j.error)) || 'gateway error'; }
async function gw(path, params){ const qs=new URLSearchParams(params||{}).toString();
  const r=await fetch(`${gwBase()}${path}${qs?('?'+qs):''}`, { credentials:'include', headers:apiHeaders() });
  const j=await r.json(); if(!r.ok||j.error) throw new Error(providerError(j)); return j; }
async function gwWrite(path, params){ const qs=new URLSearchParams(params||{}).toString();
  const r=await fetch(`${gwBase()}${path}?${qs}`, { method:'POST', credentials:'include', headers:apiHeaders() });   // params in query string, no body
  const j=await r.json(); if(!r.ok||j.error) throw new Error(providerError(j)); return j; }
const gwCreate = gwWrite;   // returns the created { id }
/* ── queryAny: dispatch a section's data source to prism SQL or a REST gateway (point 10) ── */
async function queryAny(ds, spec){
  if(ds.kind==='prism') return queryModel(ds.prism, spec.sql);
  if(ds.kind==='rest'){ const j = await gw((ds.base||'')+(spec.path||''), spec.params); return ds.map ? ds.map(j) : j; }
  throw new Error('Unknown data source kind: '+ds.kind);
}

/* ── inline Phosphor-style icons ── */
const ICONS = {
  grid:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  chart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16l4-5 3 3 4-6"/></svg>',
  table:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>',
  funnel:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
  calendar:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',

  info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  x:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  caret:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>',
  arrowup:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',

  warning:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  chat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l.8-5.5A8 8 0 1 1 21 12z"/></svg>',
  send:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  collapse:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>',
  expand:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>',
  optimize:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>',
  spark:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>',
  cart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2.3 12.4a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 7H5.5"/></svg>',
};
// "Powered by Ask-Y" mark — the isometric brand cube + wordmark, inline so it needs no external asset.

/* ══════════════════════════ SYNTHETIC DATA (demo mode) ══════════════════════════ */
const PLATFORMS=['Search','Social','Video','Display'];   // generic channel demo values (no real product names)
const DEVICES=['Mobile','Desktop','Tablet'];
const STATUSES=['ACTIVE','PAUSED','ENDED'];
const OBJECTIVES=['Conversions','Traffic','Awareness'];
// Each synthetic campaign has a real FLIGHT — an active window [active_from, active_to] of
// flight_days — plus a per-day baseline (_dSpend/_dImpr/…). The top-level spend/impressions/…
// are the whole-flight totals (= baseline × flight_days). rowsForSection() filters a campaign in
// only when its flight OVERLAPS the active date range and prorates its metrics to the in-range
// days, so a campaign that wasn't running in the selected range never appears (and never gets a
// fabricated day-by-day breakdown). Real mode mirrors this: the warehouse SUMs over WHERE date in
// range, which is 0 rows for an inactive campaign.
function synthRows(n){
  // Anchor flights to TODAY so the demo always looks current — recent date presets (Last 7d/30d)
  // show the campaigns that were running in that window instead of an empty table.
  const rows=[]; const anchor=new Date(); const iso=d=>d.toISOString().slice(0,10);
  for(let i=0;i<n;i++){
    const plat=PLATFORMS[i%PLATFORMS.length], dev=DEVICES[i%DEVICES.length], obj=OBJECTIVES[i%3];
    const dSpend = 40 + Math.abs(Math.sin(i*1.7))*1200;              // per-day baseline
    const dClicks= dSpend*(0.4+Math.abs(Math.cos(i))*1.6);
    const dImpr  = dClicks*(20+Math.abs(Math.sin(i*2.3))*60);
    const dConv  = dClicks*(0.01+Math.abs(Math.sin(i*0.7))*0.06);
    const dRev   = dConv*(30+Math.abs(Math.cos(i*1.1))*120);
    const flightDays = 6 + (i*7)%34;                                 // 6..39 active days
    const endOffset  = (i*13)%56;                                    // flight ended 0..55 days before anchor
    const aTo=new Date(anchor); aTo.setDate(aTo.getDate()-endOffset);
    const aFrom=new Date(aTo);  aFrom.setDate(aFrom.getDate()-(flightDays-1));
    const spend=dSpend*flightDays, clicks=Math.round(dClicks*flightDays),
          impr=Math.round(dImpr*flightDays), conv=Math.round(dConv*flightDays), rev=dRev*flightDays;
    rows.push({
      campaign_id:'c'+(1000+i), campaign_name:plat+' · '+obj+' '+(i+1),
      platform:plat, device:dev, objective:obj,
      status:STATUSES[i%6===0?2:(i%3===0?1:0)],
      spend, impressions:impr, clicks, conversions:conv, revenue:rev,
      ctr: clicks/Math.max(impr,1), roas: rev/Math.max(spend,1), cpa: conv?spend/conv:null,
      active_from: iso(aFrom), active_to: iso(aTo), flight_days: flightDays,
      _dSpend:dSpend, _dImpr:dImpr, _dClicks:dClicks, _dConv:dConv, _dRev:dRev,
      event_date: iso(aTo),
      creative:'https://picsum.photos/seed/'+i+'/64/40'
    });
  }
  return rows;
}

/* ── config-aware synthetic data ── demo mode must never be all-zeros for ANY app. Each source gets rows
   carrying exactly the fields ITS sections reference (KPI exprs, chart metric/dimension, table columns,
   funnel steps, slicers). Campaign-like sources keep the rich flighted synthRows demo (proration + daily
   breakdown); every other source gets generic non-zero rows whose value TYPE is inferred from the field
   name (date / id / dimension / rate / metric). This is what makes every built app behave the same. */
function synthDays(n){ const out=[], a=new Date(); for(let i=n-1;i>=0;i--){ const d=new Date(a); d.setDate(d.getDate()-i); out.push(d.toISOString().slice(0,10)); } return out; }
function synthFieldsForSource(id){
  const fields=new Set(), dims=new Set(); const dateField=(APP_CONFIG.dataSources[id]||{}).dateCol||'';
  for(const sec of (APP_CONFIG.sections||[])){ if(((sec.source)||'primary')!==id) continue;
    (sec.kpis||[]).forEach(k=>k.expr&&fields.add(k.expr));
    (sec.charts||[]).forEach(c=>{ c.metric&&fields.add(c.metric); c.metricY&&fields.add(c.metricY); if(c.dimension){ fields.add(c.dimension); dims.add(c.dimension); } });
    ((sec.table&&sec.table.columns)||[]).forEach(col=>col.key&&fields.add(col.key));
    ((sec.funnel&&sec.funnel.steps)||[]).forEach(s=>{ s.metric&&fields.add(s.metric); s.web&&fields.add(s.web); });
  }
  (APP_CONFIG.slicers||[]).forEach(s=>{ if(s.field){ fields.add(s.field); dims.add(s.field); } });
  return { fields:[...fields], dims, dateField };
}
const SYNTH_VOCAB={
  channel:['Organic Search','Direct','Paid Social','Paid Search','Referral','Email','Display','Organic Social'],
  platform:['Meta','Google','LinkedIn','TikTok','Microsoft'], device:['Mobile','Desktop','Tablet'],
  objective:['Conversions','Traffic','Awareness'], status:['ACTIVE','PAUSED','ENDED'], country:['US','UK','DE','FR','IL','CA'],
  _default:['Group A','Group B','Group C','Group D','Group E','Group F','Group G','Group H'] };
function synthVocab(f){ const k=Object.keys(SYNTH_VOCAB).find(x=>x!=='_default'&&f.toLowerCase().includes(x)); return SYNTH_VOCAB[k]||SYNTH_VOCAB._default; }
function synthValue(f,i,dims,dateField,days){
  const lf=f.toLowerCase();
  if(f===dateField || /(^|_)date$|event_date|session_date/.test(lf)) return days[i%days.length];
  if(/(^|_)id$|^user$|^session/.test(lf)) return lf.includes('user') ? 'u'+(i%Math.max(8,Math.floor(days.length*2.4))) : f+'_'+i;
  if(dims.has(f)){ const v=synthVocab(f); return v[i%v.length]; }
  if(/page.?path|url|^path$/.test(lf)) return ['/','/pricing','/product','/blog','/docs','/about','/contact','/signup'][i%8];
  if(/name$|title|campaign/.test(lf)) return synthVocab('platform')[i%5]+' · '+SYNTH_VOCAB.objective[i%3]+' '+(i+1);
  if(/ctr|cvr|rate|roas|cpc|cpa|ratio|percent|pct/.test(lf)) return +(0.01+Math.abs(Math.sin(i*1.3+lf.length))*0.45).toFixed(4);
  return Math.round(20+Math.abs(Math.sin(i*1.7+lf.length))*1500);   // generic positive metric
}
function synthForSource(id){
  const {fields,dims,dateField}=synthFieldsForSource(id);
  const ds=APP_CONFIG.dataSources[id]||{};
  const campaignLike = ds.category==='ad' || fields.some(f=>/^(spend|impressions|clicks)$/i.test(f));
  const days=synthDays(60);
  const base = campaignLike ? synthRows(48) : Array.from({length:200},()=>({}));   // campaign keeps flights; others generic
  return base.map((row,i)=>{
    for(const f of fields){ if(!(f in row) || row[f]==null) row[f]=synthValue(f,i,dims,dateField,days); }
    if(!('n' in row)) row.n=1;   // analytics charts often count rows via a metric named 'n'
    if(dateField && dateField!=='_allTime' && !(dateField in row) && !('event_date' in row)) row[dateField]=days[i%days.length];
    return row;
  });
}

/* ══════════════════════════ TIME GRAIN (D/W/M/Q) ══════════════════════════ */
// Each grain reshapes the date-range presets (grainPresets/resolveRange) AND re-buckets
// time-series charts (dateBucketKey). W/M/Q default to the current period; D defaults to
// Today but offers "Last 7d" as its first/obvious preset so it's never a one-dot chart.
const GRAIN_PRESETS = {
  D: ['last_7d','today','last_30d','last_90d'],
  W: ['this_week','last_4w','last_8w','last_12w'],
  M: ['this_month','last_3m','last_6m','last_12m'],
  Q: ['this_quarter','last_4q','last_8q'],
};
const GRAIN_DEFAULT = { D:'today', W:'this_week', M:'this_month', Q:'this_quarter' };
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
// Map a row's 'YYYY-MM-DD' date to its bucket key for the active grain. Keys are strings
// that sort chronologically, so the existing Object.keys(...).sort() stays correct.
function dateBucketKey(dateStr, g){
  if(!dateStr) return dateStr;
  const s=String(dateStr);
  if(g==='M') return s.slice(0,7);                                                   // YYYY-MM
  if(g==='Q'){ const [y,mm]=s.split('-'); return `${y}-Q${Math.floor((+mm-1)/3)+1}`; } // YYYY-Q#
  if(g==='W'){ const d=new Date(s.slice(0,10)+'T00:00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoOf(d); } // Monday of that week
  return s.slice(0,10);                                                              // D: YYYY-MM-DD
}
// A chart dimension that is a date/time field (event_date, session_date, date, month, …). Time
// axes bucket by grain and are the only breakdowns the time-filter "one bucket → skip" rule touches.
function isTimeField(d){ return /(^|_)(date|time|day|week|month|quarter|year|hour|minute)s?($|_)/i.test(String(d||'')); }

/* ══════════════════════════ ALPINE FACTORY ══════════════════════════ */
function app(){
  return {
    appName:APP_CONFIG.title, appInitial:APP_CONFIG.appInitial, appLogo:APP_CONFIG.logo||'', askyLogo:ASKY_LOGO, askyCube:ASKY_CUBE,
    sections:APP_CONFIG.sections, slicers:APP_CONFIG.slicers, chatStarters:APP_CONFIG.chatStarters,
    section:APP_CONFIG.sections[0].id, sidebarOpen:true,
    dataSource:'real', loading:false, error:null, freshness:'just now',
    range:{ preset:APP_CONFIG.dataSources.primary.defaultPreset||'last_30d', from:null, to:null },
    granularity:'D', hideDate:APP_CONFIG.hideDate||false,
    customRangeOpen:false, customFrom:'', customTo:'', crY:null, crM:null,   // crY/crM = the calendar month on view
    filters:{ global:[], drill:[], chat:[] },      // chat is now a real 4th scope (point 3)
    sectionFilters:{}, sectionFilterOpen:null, colFilterOpen:null, sortState:{}, expandedRows:{},
    tablePageSize:50, tablePage:{},                 // (legacy pagination fields — tables now show all rows in a scroll area)
    tableDisplayCap:1000,                           // DOM safety cap: render up to this many rows; more → scroll shows first N + a note (Copy still exports all)
    openSlicers:[], slicerValues:{}, commandPaletteOpen:false, paletteMode:'search',
    widgets:[], widgetBuilderOpen:false, wTitle:'', wMetricKey:'', wBreakdown:'', wType:'bar',
    drillHistory:[], peek:null, tip:{ show:false, html:'', x:0, y:0 },
    /* @MODULE:STATE */
    toasts:[], _tid:0, _rows:[], _sourceRows:{}, _charts:{}, _asOf:null,   // _asOf = latest date in the loaded data (2e); null ⇒ fall back to the system clock
    _triedSynthFallback:false,   // auto-fallback to synthetic once when no live endpoint is reachable (no toggle)
    _loadedRange:{}, _loadedMode:null, _asOfProbed:false,   // fetch cache: reuse rows unless the date window widens or the data mode changes (perf)
    _asOfBySource:{},   // per-source latest date → drives the per-tab freshness badge
    chatOpen:false, chatMessages:[], chatInput:'', chatProcessing:false, chatStatus:'', chatInvestigationId:null, chatCursor:0,

    /* ── lifecycle ── */
    async init(){
      this.widgets = safeGet('widgets', []);
      const h=location.hash.slice(1); if(h && this.sections.some(s=>s.id===h)) this.section=h;
      this.$watch('section', ()=>{ location.hash=this.section; this.recomputeSection(); });
      this._sourceRows={}; for(const id of Object.keys(APP_CONFIG.dataSources)) this._sourceRows[id]=synthForSource(id);
      this._rows=this._sourceRows.primary||[];
      this.deriveSlicerValues();
      window.addEventListener('resize', ()=>Object.values(this._charts).forEach(c=>{ try{ c&&c.resize(); }catch(e){} }));
      await this.reloadAll();
    },
    icon(n){ return ICONS[n]||''; },
    currentSection(){ return this.sections.find(s=>s.id===this.section)||this.sections[0]; },
    navigate(id){ this.section=id; },
    deriveSlicerValues(){ const all=[].concat(...Object.values(this._sourceRows||{})); const rows=all.length?all:(this._rows||[]);
      // field-presence guard: a slicer only sees rows that HAVE its field, so per-source slicers don't cross-bleed.
      for(const s of this.slicers){ if(s.field) this.slicerValues[s.id]=[...new Set(rows.filter(r=>s.field in r).map(r=>r[s.field]))].filter(v=>v!=null && v!==''); } },

    /* ── Real vs Synthetic data source ──
       'synthetic' = the built-in demo dataset (works offline, deterministic — for local preview/recording).
       'real'      = live data from your Prism via the connection layer (getModelView). Deployed under your
                     app slug it reads through the session cookie; from local preview there's no endpoint, so
                     it surfaces an explanatory banner instead of silently showing fake numbers. */
    // Fetch WHERE — DATE BOUNDS ONLY (perf). Categorical filters are applied CLIENT-SIDE in
    // rowsForSection, never pushed to the query — so toggling a filter never triggers a refetch (the
    // cached window already holds every category), and only widening the date window can force one.
    buildWhere(dateCol, range){
      const cl=[];
      const {from,to}=range||this.resolveRange();
      if(dateCol && from) cl.push(`${escapeIdent(dateCol)} >= '${escapeSqlLiteral(from)}'`);
      if(dateCol && to)   cl.push(`${escapeIdent(dateCol)} <= '${escapeSqlLiteral(to)}'`);
      return cl.length? ' WHERE '+cl.join(' AND ') : '';
    },
    // Does the already-fetched window `loaded` fully contain the window `need`? null bound = unbounded.
    // EXACT match, not "superset contains": a source whose loadSource() pre-aggregates in SQL
    // (SUM/GROUP BY over the date WHERE) returns rows that are totals for the fetched window and carry
    // no per-row date, so client-side date filtering can't narrow a wider cached window to a smaller
    // selection — the numbers can only change by re-running the query. So ANY change to the date window
    // (widen OR narrow) must refetch. Categorical filter toggles never touch the date window, so they
    // still hit the cache and stay instant.
    _rangeCovers(loaded, need){
      if(!loaded) return false;
      return loaded.from===need.from && loaded.to===need.to;
    },
    async loadData(){
      // GENERIC MULTI-SOURCE LOADER — loads EVERY entry in APP_CONFIG.dataSources, both Prism tables
      // (kind:'prism', via getModelView) AND linked API gateways (kind:'rest', via the gw() proxy).
      // Rows are stored per source id in _sourceRows; _rows mirrors `primary` for back-compat.
      // Idempotent both ways: synthetic ALWAYS regenerates, real ALWAYS refetches.
      const ids=Object.keys(APP_CONFIG.dataSources);
      if(this.dataSource==='synthetic'){
        this._sourceRows={}; for(const id of ids) this._sourceRows[id]=synthForSource(id);
        this._rows=this._sourceRows.primary||[]; this.error=null; this.deriveSlicerValues();

    colValueSelected(sec,col,v){ const s=(this.sectionFilters[sec.id]||{})[col.key]; return !!(s&&s.v&&s.v.includes(String(v))); },
    toggleColValue(sec,col,v){ const s=this._colSpec(sec,col); v=String(v); s.v.includes(v)? s.v=s.v.filter(x=>x!==v) : s.v.push(v); this.tablePage[sec.id]=0; },

    colFilterActive(sec,col){ const s=(this.sectionFilters[sec.id]||{})[col.key]; if(!s) return false;

    clearColFilter(sec,col){ if(this.sectionFilters[sec.id]) delete this.sectionFilters[sec.id][col.key]; this.tablePage[sec.id]=0; },
    tableFilterCount(sec){ const m=this.sectionFilters[sec.id]||{}; return (sec.table.columns||[]).filter(c=>this.colFilterActive(sec,c)).length; },
    clearAllColFilters(sec){ this.sectionFilters[sec.id]={}; this.tablePage[sec.id]=0; },
    // Apply every active per-column filter to a derived rowset.

    copyTableImage(sec){
      const rows=this.tableRowsAll(sec);

      const cols=(sec.table.columns||[]).filter(c=>c.type!=='image' && (c.label||c.key));
      const heads=cols.map(c=>(c.label||this.pfLabel(c.key)).toUpperCase());
      const tot=this.tableTotals(sec).cells;
      const cellText=(c,r)=>{ const v=r[c.key]; if(v==null||v==='') return '—';

        ctx.fillStyle='#1a2035'; x=0;

    /* ── grouped + expandable table model (both opt-in per section) ──

    colCount(sec){ return (sec.table.columns||[]).length + (sec.table.rowDetail?1:0); },

    tableGroups(sec,rows,field){
      const m={};
      for(const r of rows){ const k=(r[field]==null||r[field]==='')?'—':String(r[field]);

    // Totals row — sums only additive columns (currency/number/integer). Rates, ratios and per-unit costs

    // first text-ish column. Totals reflect ALL filtered rows, not just the current page.
    tableTotals(sec){

      for(const col of (sec.table.columns||[])){
        if(['currency','number','integer'].includes(col.type)){ cells[col.key]=fmtCell(col.type, sum(col.key)); }
        // 2b — a ratio/rate/per-unit total is the POOLED SUM(num)/SUM(den), never a column sum nor an
        // average of per-row ratios. Only when the column names its num/den (e.g. roas → num:'revenue',
        // den:'spend'); otherwise it stays '—', since those types genuinely can't be summed.

        else cells[col.key]='—';

      if(!labelled){ const c0=(sec.table.columns||[])[0]; if(c0) cells[c0.key]=`Total · ${rows.length.toLocaleString()}`; }

    },
    tableDisplay(sec){

    // Columns for the per-day breakdown sub-table (rowDetail:'daily'). Date left, metrics right.
    dailyColumns(){ return [
      {key:'event_date',label:'Date',type:'date'},
      {key:'spend',label:'Spend',type:'currency'},
      {key:'impressions',label:'Impr.',type:'number'},
      {key:'clicks',label:'Clicks',type:'number'},
      {key:'ctr',label:'CTR',type:'percent'},
      {key:'cpc',label:'CPC',type:'perunit'},
      {key:'conversions',label:'Conv.',type:'number'},
      {key:'cpa',label:'CPA',type:'perunit'},

    /* Per-day rows for ONE campaign — ONLY the days it was actually active within the current range.
