       flight ∩ range window) and in-range totals. We list exactly those days and split the in-range
       totals across them, so the breakdown sums to the row shown and never invents days the campaign
       wasn't running. REAL mode: the build agent swaps the body for a getModelView query —
       SELECT <dateCol>, SUM(spend)… FROM <prism> WHERE campaign_id = :id AND <range/filter WHERE>
       GROUP BY <dateCol> ORDER BY <dateCol>. */
    dailyRows(sec,row){
      let from=row._rangeFrom, to=row._rangeTo;
      if(!from || !to){                                     // point row (no flight) → fall back to the range window
        const src=(sec&&sec.source)||'primary';
        const dc=(APP_CONFIG.dataSources[src]||APP_CONFIG.dataSources.primary).dateCol||'event_date';
        const rr=this.resolveRange(); from=rr.from; to=rr.to;
        const dates=this.rowsBySource(src).map(r=>r[dc]).filter(Boolean).map(s=>String(s).slice(0,10)).sort();
        const maxD=dates.length?dates[dates.length-1]:'2026-06-16';
        to=to||maxD; if(!from) from=this._addDays(to,-13);
      }
      let cur=from; const all=[]; let guard=0;
      while(cur<=to && guard++<400){ all.push(cur); cur=this._addDays(cur,1); }
      const days = all.length>62 ? all.slice(all.length-62) : all;   // safety cap for an unusually long flight
      if(!days.length) days.push(to);
      const seed=(parseInt(String(row.campaign_id||row.campaign_name||'7').replace(/\D/g,''),10)||7);
      const w=days.map((d,i)=>0.55+Math.abs(Math.sin(seed*0.37+i*1.31)));   // deterministic per-day weights
      const wsum=w.reduce((a,b)=>a+b,0)||1;
      return days.map((d,i)=>{
        const f=w[i]/wsum;
        const spend=(+row.spend||0)*f, impr=Math.round((+row.impressions||0)*f),
              clicks=Math.round((+row.clicks||0)*f), conv=Math.round((+row.conversions||0)*f), rev=(+row.revenue||0)*f;
        return { event_date:d, spend, impressions:impr, clicks, conversions:conv, revenue:rev,
                 ctr: impr?clicks/impr:0, cpc: clicks?spend/clicks:null, cpa: conv?spend/conv:null, roas: spend?rev/spend:null };
      });
    },
    renderCell(col,row){
      const v=row[col.key];
      // SECURITY: escape untrusted cell values (warehouse / 3rd-party ad-platform data) before rendering as HTML.
      const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      if(col.type==='image'){ if(!v) return ''; const src=/^(https?:|data:image\/)/i.test(String(v))?esc(v):''; return src?`<img src="${src}" class="w-12 h-8 object-cover rounded border border-[var(--border)]" loading="lazy">`:''; }
      if(col.type==='status'){ const tone=v==='ACTIVE'?'positive':v==='PAUSED'?'warning':'neutral'; return `<span class="text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-[var(--${tone}-light)] text-[var(--${tone})]">${esc(v)}</span>`; }
      if(col.type==='badge'){ let tone='primary',light='primary-light'; if(v==='Pause'){tone='negative';light='negative-light';} else if(v==='Scale'){tone='positive';light='positive-light';} return `<span class="text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-[var(--${light})] text-[var(--${tone})]">${esc(v)}</span>`; }
      if(col.type==='text') return `<span class="font-medium">${v==null?'—':esc(v)}</span>`;
      const title=col.type==='currency'?fmt('currency',v).exact:'';
      return `<span class="tabular-nums" title="${esc(title)}">${fmtCell(col.type,v)}</span>`;
    },

    /* ── KPI/chart helpers ── */
    kpiTooltip(k){ return k.tooltip || `${(k.agg||'').toUpperCase()}(${k.expr})`; },
    deltaGood(k){ return (k._delta>=0)===!!k.favorableUp; },
    // What the delta is measured against — so a green/red arrow never leaves the reader guessing
    // "% of what, since when?". The comparison is always this range vs. the equal-length span before it.
    comparePeriodPhrase(){
      const p=this.range.preset;
      return ({ today:'yesterday', last_7d:'the prior 7 days', last_30d:'the prior 30 days', last_90d:'the prior 90 days',
        this_week:'last week', last_4w:'the prior 4 weeks', last_8w:'the prior 8 weeks', last_12w:'the prior 12 weeks',
        this_month:'last month', last_3m:'the prior 3 months', last_6m:'the prior 6 months', last_12m:'the prior 12 months',
        this_quarter:'last quarter', last_4q:'the prior 4 quarters', last_8q:'the prior 8 quarters',
        mtd:'the same days last month', ytd:'the same period last year', this_year:'last year',
        all_time:'the first half of the range', custom:'the equal-length period just before it'
      })[p] || 'the previous period of the same length'; },
    deltaTipText(k){ const dir=k._delta>=0?'up':'down'; return `${Math.abs(k._delta||0).toFixed(1)}% ${dir} vs. ${this.comparePeriodPhrase()}`; },
    deltaTipHtml(k){
      const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const pct=Math.abs(k._delta||0).toFixed(1)+'%';
      const word=k._delta>=0?'higher':'lower';
      const good=this.deltaGood(k);
      let h=`<b>${pct} ${word}</b> than ${esc(this.comparePeriodPhrase())}`;
      h+=`<br>Selected range: <b>${esc(this.rangeLabel())}</b>, compared with the equal-length period immediately before it.`;
      h+=`<br><span class="src">${good?'Green — moving the favorable way for this metric.':'Red — moving the unfavorable way for this metric.'}</span>`;
      return h; },
    chartSubtitle(c){ const a={sum:'Total',avg:'Average',distinct:'Distinct',ratio:'Pooled'}[c.agg]||''; let s=`${a} ${c.metric}${c.metricY?(' vs '+c.metricY):''} by ${c.dimension} · ${c.type}`;
      if(c._unfiltered) s+=' · +context window';
      (c._skippedFilters||[]).forEach(f=> s+=` · all ${f} (filter skipped)`);
      return s; },

    /* ── metric explainability (framework requirement) ──
       Every KPI / chart series / table column explains itself on hover, immediately:
       (a) what it is, (b) how it's calculated, (c) which source it comes from. */
    metricTipHtml(label, how, source){
      const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      let h=`<b>${esc(label)}</b>`;
      if(how) h+=`<br>${esc(how)}`;
      h += source ? `<br><span class="src">Source: ${esc(source)}</span>`
                  : `<br><span class="src">Source: not specified — set <code>source</code> in APP_CONFIG.</span>`;
      return h;
    },
    chartTip(c){ const a={sum:'Total',avg:'Average',distinct:'Distinct'}[c.agg]||''; return c.tooltip || `${a} ${c.metric}${c.metricY?(' vs '+c.metricY):''} by ${c.dimension}`.trim(); },
    columnTip(col){ return col.tooltip || (({currency:'Currency value',percent:'Percentage rate',ratio:'Ratio / multiplier',perunit:'Per-unit cost',number:'Numeric value',date:'Date',status:'Status',badge:'Category',text:'Label',image:'Image'}[col.type]||'Value')+` · column "${col.key}"`); },
    // The tooltip is the ONLY tooltip (no native title= on these elements → no double popup) and it is
    // hoverable: leaving the trigger starts a short close timer that moving onto the tooltip cancels, so
    // the user can travel to it and select/copy its text. tipEnter() keeps it open while hovered.
    showTip(ev, html){ clearTimeout(this._tipTimer); this.tip.html=html; this.moveTip(ev); this.tip.show=true; },
    moveTip(ev){ const pad=14, w=290, h=110; let x=ev.clientX+pad, y=ev.clientY+pad;
      if(x+w>window.innerWidth) x=ev.clientX-w-pad; if(y+h>window.innerHeight) y=ev.clientY-h-pad;
      this.tip.x=Math.max(8,x); this.tip.y=Math.max(8,y); },
    tipEnter(){ clearTimeout(this._tipTimer); this.tip.show=true; },
    hideTip(){ clearTimeout(this._tipTimer); this._tipTimer=setTimeout(()=>{ this.tip.show=false; }, 260); },

    /* ── widgets ── */
    /* ── widget builder: Title · Metric · Breakdown · Chart type · live preview ──
       Metrics are the numeric fields in the section's data (+ a record count); dimensions are the
       slicer fields (+ campaign). computeWidget() aggregates the live rows so the preview and the
       placed card share one renderer (renderWidgetBody) and always match. */
    widgetMetrics(){ const r=(this.rowsForSection()[0])||{};
      const labels={spend:'Spend',revenue:'Revenue',conversions:'Conversions',clicks:'Clicks',impressions:'Impressions',sessions:'Sessions'};
      const rate=['ctr','roas','cpa','cpc','flight_days']; // rates/ids aren't summable widget metrics
      const nums=Object.keys(r).filter(k=>!k.startsWith('_')&&typeof r[k]==='number'&&!rate.includes(k));
      const list=nums.map(k=>({key:k,label:labels[k]||k.replace(/_/g,' '),agg:'sum',format:(k==='spend'||k==='revenue')?'currency':'count'}));
      list.push({key:'_count',label:'Records',agg:'count',format:'count'}); return list; },
    widgetDims(){ const dims=this.slicers.filter(s=>s.field).map(s=>({key:s.field,label:s.label}));
      if(!dims.some(d=>d.key==='campaign_name')) dims.push({key:'campaign_name',label:'Campaign'}); return dims; },
    previewCfg(){ return {metric:this.wMetricKey,breakdown:this.wBreakdown,type:this.wType}; },
    widgetAutoTitle(){ const m=this.widgetMetrics().find(x=>x.key===this.wMetricKey)||this.widgetMetrics()[0]||{label:'Metric'};
      const d=this.widgetDims().find(x=>x.key===this.wBreakdown)||this.widgetDims()[0]||{label:''};
      return (m.label||'Metric')+(this.wType==='single'?'':(this.wType==='line'?' over time':(' by '+(d.label||'')))); },
    openWidgetBuilder(){ this.wMetricKey=this.wMetricKey||((this.widgetMetrics()[0]||{}).key||'_count');
      this.wBreakdown=this.wBreakdown||((this.widgetDims()[0]||{}).key||''); this.wType=this.wType||'bar'; this.wTitle=''; this.widgetBuilderOpen=true; },
    computeWidget(cfg){ cfg=cfg||{}; const rows=this.rowsForSection();
      const m=this.widgetMetrics().find(x=>x.key===cfg.metric)||{key:'_count',agg:'count',format:'count'};
      const val=r=> m.key==='_count'?1:(+r[m.key]||0);
      if(cfg.type==='single'){ const total=rows.reduce((a,r)=>a+val(r),0); return {type:'single',format:m.format,total,series:[]}; }
      if(cfg.type==='line'){ const sec=this.currentSection();
        // same rule as section time charts: widen to the ~1-level context window only at the default date
        // state; once a date filter is set, honour the active range. Bucketed at the chart's grain.
        const tc={dimension:'event_date',type:'line'}; const g=this._grainForChart(sec,tc);
        const range=this.chartShowsContext(sec,tc)?this._timeChartRange(sec,tc):null;
        const src=this.rowsForSection(sec,{range, skipFilter:(r)=>this._filterCollapsesDim(sec,cfg.breakdown,r)});
        const mm={}; for(const r of src){ const k=dateBucketKey(r.event_date,g); if(k==null) continue; mm[k]=(mm[k]||0)+val(r); }
        const series=Object.keys(mm).sort().map(k=>({label:k,value:mm[k]})); return {type:'line',format:m.format,total:series.reduce((a,b)=>a+b.value,0),series}; }
      const dim=cfg.breakdown||(this.widgetDims()[0]||{}).key||'platform';
      // same categorical rule: a filter that narrows this widget's own breakdown to one category is skipped here.
      const sec=this.currentSection();
      const dimRows=this.rowsForSection(sec,{ skipFilter:(r)=>this._filterCollapsesDim(sec,dim,r) });
      const mm={};
      for(const r of dimRows){ const k=(r[dim]==null||r[dim]==='')?'—':String(r[dim]); mm[k]=(mm[k]||0)+val(r); }
      const series=Object.keys(mm).map(k=>({label:k,value:mm[k]})).sort((a,b)=>b.value-a.value).slice(0,12);
      return {type:cfg.type||'bar',format:m.format,total:series.reduce((a,b)=>a+b.value,0),series}; },
    renderWidgetBody(cfg){ const d=this.computeWidget(cfg);
      const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if(d.type==='single') return `<div class="text-3xl font-bold tabular-nums">${fmt(d.format,d.total).label}</div>`;
      if(!d.series.length) return `<div class="text-sm text-[var(--muted-foreground)] py-6 text-center">No data for the current filters.</div>`;
      if(d.type==='line'){ const vs=d.series.map(s=>s.value), max=Math.max(...vs,1), min=Math.min(...vs,0), W=240,H=70;
        const pts=vs.map((v,i)=>`${(vs.length<2?0:i/(vs.length-1))*W},${H-((v-min)/((max-min)||1))*H}`).join(' ');
        return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-[80px]" preserveAspectRatio="none"><polyline fill="none" stroke="var(--primary)" stroke-width="2" points="${pts}"/></svg>`
          +`<div class="mt-1 flex justify-between text-[10px] text-[var(--muted-foreground)] tabular-nums"><span>${esc(d.series[0].label)}</span><span>${esc(d.series[d.series.length-1].label)}</span></div>`; }
      const max=Math.max(...d.series.map(s=>s.value),1);
      return `<div class="space-y-1">`+d.series.map(s=>`<div class="flex items-center gap-2 text-xs"><span class="w-24 truncate text-[var(--muted-foreground)]" title="${esc(s.label)}">${esc(s.label)}</span><span class="flex-1 h-3 rounded bg-[var(--surface-elevated)] overflow-hidden"><span class="block h-full rounded bg-[var(--primary)]" style="width:${Math.round(s.value/max*100)}%"></span></span><span class="tabular-nums w-16 text-right">${fmt(d.format,s.value).label}</span></div>`).join('')+`</div>`; },
    addWidget(){ const m=this.wMetricKey||((this.widgetMetrics()[0]||{}).key||'_count');
      const w={ id:'w'+Date.now(), title:this.wTitle||this.widgetAutoTitle(), metric:m, breakdown:this.wBreakdown||((this.widgetDims()[0]||{}).key||''), type:this.wType||'bar', widgetFilters:[] };
      this.widgets.push(w); safeSet('widgets',this.widgets);
      this.wTitle=''; this.widgetBuilderOpen=false; this.toast('Widget added'); },
    removeWidget(id){ this.widgets=this.widgets.filter(w=>w.id!==id); safeSet('widgets',this.widgets); },

    /* ── chat (4th scope) ── */
    /* ── Asky chat — grounded in this project's Prism via the Asky agent ──
       Same contract the Creative Studio uses: POST /<slug>/api/chat/start to open an investigation,
       /chat/respond for follow-ups in the same thread, and short-poll /chat/poll for streamed items.
       Requires the DEPLOYED app (Mode-2 cookie auth) + Real data; in Synthetic mode there's no backend
       to reach, so we say so plainly rather than fake an answer. */
    // New session: clear the in-app conversation + drop the Prism investigation so the next question opens
    // a fresh thread. Reset without refreshing. Any in-flight poll is abandoned (chatPoll bails when the
    // investigation id changes).
    chatNewSession(){ this.chatInvestigationId=null; this.chatCursor=0; this.chatMessages=[]; this.chatStatus=''; this.chatProcessing=false; this.chatInput=''; },
    async chatSend(text){
      text=(text||'').trim(); if(!text || this.chatProcessing) return; this.chatInput='';
      this.chatMessages.push({role:'user',text}); this.chatProcessing=true; this.chatStatus='Thinking…';
      if(this.dataSource==='synthetic'){
        this.chatProcessing=false; this.chatStatus='';
        this.chatMessages.push({role:'assistant',text:"I'm in Synthetic (demo) mode, so I can't reach your data. On the deployed app, switch the header toggle to “Real data” and I'll answer grounded in this project's Prism."});
        return;
      }
      try{
        if(!this.chatInvestigationId){
          // open an investigation/session on THIS project in Prism
          const start=await fetch(apiBase()+'/chat/start',{ method:'POST', credentials:'include', headers:apiHeaders(), body:JSON.stringify({ workspaceId:wsId(), projectId:projId(), prompt:text }) }).then(r=>r.json());
          this.chatInvestigationId = start && (start.investigationId||start.id||start.investigation_id||start.conversationId||start.sessionId);
          this.chatCursor=0;
          if(!this.chatInvestigationId) throw new Error((start&&(start.error||start.message))||'could not start the assistant');
        } else {
          // follow-up in the SAME investigation (keeps conversation context). /chat/respond wants
          // `message` (NOT `prompt` like /chat/start) — sending `prompt` fails with "message is required",
          // which is why follow-ups hung. Send both, surface errors, and adopt any id/cursor it returns.
          const resp=await fetch(apiBase()+'/chat/respond',{ method:'POST', credentials:'include', headers:apiHeaders(), body:JSON.stringify({ investigationId:this.chatInvestigationId, workspaceId:wsId(), message:text, prompt:text }) }).then(r=>r.json()).catch(()=>null);
          if(resp){ if(resp.investigationId) this.chatInvestigationId=resp.investigationId; if(resp.cursor!=null) this.chatCursor=resp.cursor; if(resp.ok===false) throw new Error(resp.error||resp.message||'could not continue the chat'); }
        }
        await this.chatPoll();
      }catch(e){ this.chatMessages.push({role:'assistant',text:'Sorry — I couldn’t reach the assistant ('+((e&&e.message)||'error')+'). The chat runs on the deployed app (cookie sign-in) against a live Prism project.'}); }
      finally{ this.chatProcessing=false; this.chatStatus=''; }
    },
    // Short-poll the investigation. Robust on purpose: progress lines collapse to ONE live status line
    // (chatStatus), the answer accumulates into a single bubble, and we STOP as soon as the run is
    // terminal / an answer arrives / a wall-clock cap is hit — so it can never spin forever even if the
    // backend labels completion with a field we didn't anticipate.
    async chatPoll(){
      let answer='', appended=false, produced=false; const t0=Date.now(), BUDGET=180000;   // wall-clock budget, not an iteration count
      const myInv=this.chatInvestigationId;     // abandon this poll if a New chat / new question replaces the session
      const nap=ms=>new Promise(r=>setTimeout(r,ms));
      const pick=o=>(o&&(o.text||o.content||o.message||o.answer||o.markdown||o.body))||'';
      const ANS=/final|answer|assistant|result|^message$|^text$/;            // kinds that are the ANSWER, not progress
      for(let i=0;i<300;i++){
        if(Date.now()-t0>BUDGET) break;
        if(this.chatInvestigationId!==myInv) return;   // New chat / new question started → drop this poll
        let r=null;
        try{ r=await fetch(apiBase()+'/chat/poll',{ method:'POST', credentials:'include', headers:apiHeaders(), body:JSON.stringify({ investigationId:this.chatInvestigationId, workspaceId:wsId(), cursor:this.chatCursor||0, waitMs:8000 }) }).then(x=>x.json()); }
        catch(e){ await nap(2000); continue; }
        if(r && r.cursor!=null) this.chatCursor=r.cursor;
        const items=(r&&(r.items||r.messages||r.events||r.updates))||[]; let gotNew=false;
        for(const it of items){
          const txt=pick(it); if(!txt) continue;
          const k=String(it.kind||it.type||it.role||it.status||'').toLowerCase();
          const isProgress = !ANS.test(k) && (k==='processing_message' || /process|progress|status|thinking|tool|step/.test(k));
          if(isProgress){ this.chatStatus=txt; gotNew=true; }                 // latest status only → no repeats
          else if(answer.indexOf(txt)===-1){ answer += (answer?'\n\n':'')+txt; gotNew=true; }   // accumulate the answer (dedup)
        }
        // some backends deliver the final answer as a TOP-LEVEL field rather than inside items
        const top=(r&&(r.answer||r.result||r.response||r.finalMessage||(typeof r.message==='string'?r.message:'')))||'';
        if(top && answer.indexOf(top)===-1){ answer += (answer?'\n\n':'')+top; gotNew=true; }
        if(gotNew) produced=true;       // THIS turn has started producing items (backend returns only items after our cursor)
        if(answer){ if(!appended){ this.chatMessages.push({role:'assistant',text:answer}); appended=true; } else { this.chatMessages[this.chatMessages.length-1].text=answer; } }
        const st=String((r&&(r.status||r.state))||'').toLowerCase();
        const terminal = r && (r.done===true||r.terminal===true||r.finished===true||r.complete===true||r.completed===true || /complet|done|finish|fail|error|cancel|await|ready/.test(st));
        // On a follow-up the first polls can still echo the PRIOR turn's 'completed'; only stop once THIS
        // turn has actually produced something, so we don't bail before the new answer arrives.
        if(terminal && produced) break;
        if(!gotNew) await nap(2000);    // server returned fast/empty → wait before re-polling (never busy-loop)
      }
      if(!appended) this.chatMessages.push({role:'assistant',text:'The assistant didn’t return an answer in time — it may still have completed in Prism. Try again in a moment.'});
    },

    /* ── toast ── */
    toast(text,kind){ const id=++this._tid; this.toasts.push({id,text,kind}); setTimeout(()=>{ this.toasts=this.toasts.filter(t=>t.id!==id); },3000); },
  };
}
</script>
</body>
