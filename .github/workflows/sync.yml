name: Sync from asky-lib

# One-way mirror of asky-lib @ stage : /prism-app-framework-v2 into this repo's root.
# Source is READ-ONLY here; local edits to tracked files are overwritten on the next run.

on:
  schedule:
    - cron: '17 * * * *'      # hourly at :17 UTC
  workflow_dispatch:            # manual "Run workflow" button

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: write               # lets the built-in GITHUB_TOKEN push to this repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Fetch folder from asky-lib@stage
        env:
          ASKY_LIB_TOKEN: ${{ secrets.ASKY_LIB_TOKEN }}
        run: |
          git clone --depth 1 --branch stage --filter=blob:none --sparse \
            "https://x-access-token:${ASKY_LIB_TOKEN}@github.com/ASK-Y-WORKSPACES/asky-lib.git" \
            /tmp/src
          cd /tmp/src
          git sparse-checkout set prism-app-framework-v2
          echo "SRC_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Sync folder contents into mirror root
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/src/prism-app-framework-v2/ ./

      - name: Commit & push if changed
        run: |
          git config user.name  "asky-lib mirror bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync from asky-lib@stage (${SRC_SHA})"
            git push
          fi
