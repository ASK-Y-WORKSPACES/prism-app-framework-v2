<!--
  COMPONENT: filter-bar
  Purpose: Sticky filter bar — date trigger, granularity (with disabled state for invalid spans), compare,
    pinned slicer triggers (with rule-count badge + funnel icon), + Add filter, Clear all.
  Alpine scope expected: range, granularity, granularityAuto, compare, pinnedSlicers[], slicerLabels{},
    openSlicers[], filters, drillHistory, commandPaletteOpen, plus methods:
    toggleSlicer, addSlicer, loadAll, clearAll, drillBack, removeFilter, unlockedRuleCount, formatDateRange,
    validGranularities(rangeMs) -> { H: bool, D: bool, ... }, pinnedRuleCount(fieldId) -> number.
  Note: Module-type starters typically inline this rather than copying. Primitive is the canonical reference.
-->
<div class="sticky top-[56px] z-20 bg-[var(--surface)] border-b border-[var(--border)] px-6 py-2 flex items-center gap-2 overflow-x-auto">

  <!-- Date trigger -->
  <button @click="addSlicer('date_range')"
          :class="openSlicers.some(s => s.id === 'date_range') ? 'bg-[var(--primary-light)] border-[var(--primary)] text-[var(--primary)]' : 'bg-[var(--surface-elevated)] border-[var(--border)] hover:border-[var(--primary)] text-[var(--foreground)]'"
          class="flex items-center gap-2 h-8 px-3 rounded-lg border text-xs transition-colors">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         :class="openSlicers.some(s => s.id === 'date_range') ? 'text-[var(--primary)]' : 'text-[var(--muted-foreground)]'">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span class="font-medium" x-text="formatDateRange(range)"></span>
    <span :class="openSlicers.some(s => s.id === 'date_range') ? 'text-[var(--primary)]/60' : 'text-[var(--muted-foreground)]'">·</span>
    <span :class="openSlicers.some(s => s.id === 'date_range') ? 'text-[var(--primary)]/80' : 'text-[var(--muted-foreground)]'"
          x-text="range.preset === 'custom' ? 'Custom' : range.preset.replace('_', ' ')"></span>
  </button>

  <!-- Granularity (with disabled state for invalid spans) -->
  <div class="flex items-center h-8 rounded-lg bg-[var(--surface-elevated)] border border-[var(--border)] overflow-hidden">
    <template x-for="g in ['H','D','W','M','Q','Y']" :key="g">
      <button @click="if (validGranularities(range.to - range.from)[g]) { granularity = g; granularityAuto = false; loadAll(); }"
              :disabled="!validGranularities(range.to - range.from)[g]"
              :class="granularity === g
                ? 'bg-[var(--primary)] text-white'
                : (validGranularities(range.to - range.from)[g]
                  ? 'text-[var(--foreground)] hover:bg-[var(--primary-light)] hover:text-[var(--primary)]'
                  : 'text-[var(--muted-foreground)]/40 cursor-not-allowed')"
              :title="validGranularities(range.to - range.from)[g] ? ('Granularity: ' + g) : 'Window too short for this granularity'"
              class="px-2.5 h-full text-xs font-semibold tabular-nums" x-text="g"></button>
    </template>
  </div>
  <button @click="granularity = 'D'; granularityAuto = true; loadAll()"
          class="text-[10px] text-[var(--primary)] hover:underline" x-show="!granularityAuto">auto (D)</button>

  <!-- Compare -->
  <div class="flex items-center h-8 rounded-lg bg-[var(--surface-elevated)] border border-[var(--border)] overflow-hidden">
    <template x-for="opt in [['off','No compare'],['prior','vs Prior'],['yoy','YoY']]" :key="opt[0]">
      <button @click="compare = opt[0]; loadAll()"
              :class="compare === opt[0] ? 'bg-[var(--primary)] text-white' : 'text-[var(--foreground)] hover:bg-[var(--primary-light)] hover:text-[var(--primary)]'"
              class="px-2.5 h-full text-[11px] font-medium" x-text="opt[1]"></button>
    </template>
  </div>

  <div class="w-px h-5 bg-[var(--border)]"></div>

  <!-- Pinned slicer triggers -->
  <template x-for="fieldId in pinnedSlicers" :key="fieldId">
    <button @click="toggleSlicer(fieldId)"
            :class="openSlicers.some(s => s.id === fieldId)
              ? 'bg-[var(--primary-light)] text-[var(--primary)] border-[var(--primary)]'
              : 'border-[var(--border)] text-[var(--foreground)] hover:border-[var(--primary)]'"
            class="flex items-center gap-1.5 h-8 px-2.5 text-xs rounded-lg border bg-[var(--surface-elevated)] transition-colors">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           :class="openSlicers.some(s => s.id === fieldId) ? 'text-[var(--primary)]' : 'text-[var(--muted-foreground)]'">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      <span class="font-medium" x-text="slicerLabels[fieldId] && slicerLabels[fieldId].label || fieldId"></span>
      <template x-if="pinnedRuleCount(fieldId) > 0">
        <span :class="openSlicers.some(s => s.id === fieldId) ? 'bg-[var(--primary)] text-white' : 'bg-[var(--primary-light)] text-[var(--primary)]'"
              class="text-[10px] tabular-nums font-semibold px-1.5 py-0.5 rounded-md leading-none"
              x-text="pinnedRuleCount(fieldId)"></span>
      </template>
    </button>
  </template>

  <!-- + Add filter -->
  <button @click="commandPaletteOpen = true"
          class="flex items-center gap-1.5 h-8 px-2.5 text-xs rounded-lg text-[var(--muted-foreground)] hover:text-[var(--primary)] hover:bg-[var(--surface-elevated)] border border-dashed border-[var(--border)]">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add filter
    <span class="text-[10px] tabular-nums text-[var(--muted-foreground)] border border-[var(--border)] px-1 py-px rounded">⌘K</span>
  </button>

  <div class="flex-1"></div>

  <button x-show="unlockedRuleCount() > 0" @click="clearAll()"
          class="text-xs text-[var(--muted-foreground)] hover:text-[var(--negative)]"
          x-text="'Clear all (' + unlockedRuleCount() + ')'"></button>
</div>
