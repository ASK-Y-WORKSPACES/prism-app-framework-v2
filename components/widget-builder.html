<!--
  COMPONENT: widget-builder
  Purpose: Modal for creating/editing user widgets. Three-step form: type → metric → optional group-by + filters.
  Alpine scope expected: widgetBuilderOpen boolean, addWidget(config) method.
  Usage: paste once into the page (sibling of <main>). Open with widgetBuilderOpen = true.
-->
<div x-show="widgetBuilderOpen" x-transition.opacity
     @click.self="widgetBuilderOpen = false"
     @keydown.escape.window="widgetBuilderOpen = false"
     class="fixed inset-0 z-40 bg-black/30 flex items-center justify-center">
  <div class="w-[520px] bg-[var(--surface-elevated)] border border-[var(--border)] rounded-xl shadow-lg overflow-hidden"
       x-data="{ wType: 'kpi', wLabel: '', wMetric: '', wFormat: 'integer', wFavorableUp: true, wGroupBy: '' }">
    <div class="px-5 py-3 border-b border-[var(--border)] flex items-center justify-between">
      <h2 class="text-sm font-semibold">New widget</h2>
      <button @click="widgetBuilderOpen = false" class="text-[var(--muted-foreground)] hover:text-[var(--negative)]">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="p-5 space-y-4">

      <!-- Type picker -->
      <div>
        <div class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)] mb-2">Type</div>
        <div class="grid grid-cols-4 gap-2">
          <template x-for="t in ['kpi','line','bar','table']" :key="t">
            <button @click="wType = t"
                    :class="wType === t ? 'bg-[var(--primary)] text-white border-[var(--primary)]' : 'bg-[var(--surface-elevated)] border-[var(--border)] hover:border-[var(--primary)]'"
                    class="px-3 py-2 text-xs rounded-lg border capitalize" x-text="t"></button>
          </template>
        </div>
      </div>

      <!-- Label -->
      <div>
        <label class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)] mb-2 block">Label</label>
        <input x-model="wLabel" placeholder="e.g. Mobile revenue"
               class="w-full px-3 py-2 text-sm rounded-lg border border-[var(--border)] bg-[var(--surface-elevated)] focus:border-[var(--primary)] focus:ring-2 focus:ring-[var(--primary)]/20 outline-none">
      </div>

      <!-- Metric SQL -->
      <div>
        <label class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)] mb-2 block">Metric SQL fragment</label>
        <input x-model="wMetric" placeholder="e.g. SUM(revenue) or COUNT(DISTINCT user_id)"
               class="w-full px-3 py-2 text-sm rounded-lg border border-[var(--border)] bg-[var(--surface-elevated)] focus:border-[var(--primary)] focus:ring-2 focus:ring-[var(--primary)]/20 outline-none font-mono text-xs">
        <p class="text-[10px] text-[var(--muted-foreground)] mt-1">Reference columns that exist in the project's primary prism.</p>
      </div>

      <!-- Format -->
      <div>
        <div class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)] mb-2">Format</div>
        <div class="flex gap-2">
          <template x-for="f in ['integer','currency','percent','duration']" :key="f">
            <button @click="wFormat = f"
                    :class="wFormat === f ? 'bg-[var(--primary)] text-white border-[var(--primary)]' : 'border-[var(--border)] text-[var(--muted-foreground)] hover:border-[var(--primary)]'"
                    class="px-3 py-1.5 text-xs rounded-lg border capitalize" x-text="f"></button>
          </template>
        </div>
      </div>

      <!-- Group-by (bar/table only) -->
      <template x-if="wType === 'bar' || wType === 'table'">
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)] mb-2 block">Group by</label>
          <input x-model="wGroupBy" placeholder="e.g. channel_session"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-[var(--border)] bg-[var(--surface-elevated)] focus:border-[var(--primary)] focus:ring-2 focus:ring-[var(--primary)]/20 outline-none">
        </div>
      </template>

      <!-- Favorable up -->
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        <input type="checkbox" x-model="wFavorableUp" class="accent-[var(--primary)]">
        <span>Up is good (positive delta = green pill)</span>
      </label>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-[var(--border-subtle)]">
        <button @click="widgetBuilderOpen = false" class="px-3 py-2 text-sm rounded-lg text-[var(--muted-foreground)] hover:text-[var(--primary)]">Cancel</button>
        <button @click="addWidget({ type: wType, label: wLabel || 'New widget', metricSql: wMetric, format: wFormat, favorableUp: wFavorableUp, groupBy: wGroupBy, widgetFilters: [], previewValue: '—' }); widgetBuilderOpen = false; wType='kpi'; wLabel=''; wMetric=''; wGroupBy=''"
                :disabled="!wLabel.trim()"
                :class="!wLabel.trim() ? 'opacity-50 cursor-not-allowed' : ''"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white">Create</button>
      </div>
    </div>
  </div>
</div>
