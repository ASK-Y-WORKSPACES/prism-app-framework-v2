<!--
  COMPONENT: error-banner
  Purpose: Red banner for error state. Mount at the top of <main> when `error` is set, or per-card on query failure.
  Alpine scope expected: error (string), dismissable via `error = null`.
-->
<template x-if="error">
  <div role="alert" class="mx-6 mt-4 p-3 rounded-lg bg-[var(--negative-light)] flex items-start gap-3">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--negative)] shrink-0 mt-0.5">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <div class="flex-1 text-sm text-[var(--negative)]">
      <strong class="block font-semibold">Something went wrong</strong>
      <span x-text="error"></span>. Try refreshing or removing a filter.
    </div>
    <button @click="error = null" aria-label="Dismiss error" class="shrink-0 text-[var(--negative)] hover:opacity-75">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</template>
