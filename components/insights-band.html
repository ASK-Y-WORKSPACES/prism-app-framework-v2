<!--
  COMPONENT: insights-band
  Purpose: Collapsible banner above the KPI strip showing 1–3 auto-discovered insights (positive/negative/neutral).
  Alpine scope expected: insights[] array, insightsOpen boolean, plus optional applyCta(insight) method.
  Render always — if insights.length === 0, show the drill instructions hint instead.
-->
<section class="rounded-xl border border-[var(--border-strong)] bg-[var(--surface-elevated)]" aria-label="Key insights">
  <button @click="insightsOpen = !insightsOpen" class="w-full flex items-center gap-2 px-3 py-2 text-left">
    <span class="text-[10px] font-semibold tabular-nums px-1.5 py-0.5 rounded bg-[var(--primary)] text-white" x-text="'(' + insights.length + ')'"></span>
    <span class="text-xs uppercase tracking-wider font-semibold">Key insights</span>
    <span x-show="!insightsOpen" class="text-xs text-[var(--muted-foreground)] truncate" x-text="insights.map(i => i.title).join(' · ')"></span>
    <span class="ml-auto flex items-center gap-1 text-xs text-[var(--muted-foreground)]">
      <span x-text="insightsOpen ? 'collapse' : 'expand'"></span>
      <svg :class="insightsOpen ? 'rotate-180' : ''" class="transition-transform" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </span>
  </button>
  <div x-show="insightsOpen" class="border-t border-[var(--border-subtle)] p-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    <template x-for="(ins, i) in insights" :key="i">
      <div :class="ins.kind === 'positive' ? 'bg-[var(--positive-light)] border-[var(--positive)]/20'
                : ins.kind === 'negative' ? 'bg-[var(--negative-light)] border-[var(--negative)]/20'
                : 'bg-[var(--warning-light)] border-[var(--warning)]/20'"
           class="rounded-xl border p-3 flex flex-col gap-1.5">
        <div class="flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
               :class="ins.kind === 'positive' ? 'text-[var(--positive)]' : ins.kind === 'negative' ? 'text-[var(--negative)]' : 'text-[var(--warning)]'">
            <template x-if="ins.kind === 'positive'"><polygon points="6 15 12 9 18 15 6 15"/></template>
            <template x-if="ins.kind === 'negative'"><polygon points="6 9 12 15 18 9 6 9"/></template>
            <template x-if="ins.kind === 'neutral'"><circle cx="12" cy="12" r="3"/></template>
          </svg>
          <span class="text-[10px] font-bold uppercase tracking-wider"
                :class="ins.kind === 'positive' ? 'text-[var(--positive)]' : ins.kind === 'negative' ? 'text-[var(--negative)]' : 'text-[var(--warning)]'"
                x-text="'Key Insight ' + (i + 1)"></span>
        </div>
        <div class="text-sm font-semibold leading-snug" x-text="ins.title"></div>
        <div class="text-xs">
          <span class="font-bold tabular-nums" x-text="ins.metric"></span>
          <span class="text-[var(--muted-foreground)]" x-text="' ' + (ins.context || '')"></span>
        </div>
        <template x-if="ins.cta">
          <button @click="applyCta && applyCta(ins)"
                  :class="ins.kind === 'positive' ? 'text-[var(--positive)]' : ins.kind === 'negative' ? 'text-[var(--negative)]' : 'text-[var(--warning)]'"
                  class="self-start text-xs font-medium hover:underline mt-0.5" x-text="ins.cta.label"></button>
        </template>
      </div>
    </template>
    <template x-if="insights.length === 0">
      <div class="col-span-full text-xs text-[var(--muted-foreground)] p-3">
        Drill: ▶ button or double-click. Right-click for menu. ⌘K to add a filter.
      </div>
    </template>
  </div>
</section>
