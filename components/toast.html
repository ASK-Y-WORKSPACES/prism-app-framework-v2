<!--
  COMPONENT: toast
  Purpose: Top-center toast stack. Auto-dismiss 3000ms via `toast(text, kind)` in factory.
  Alpine scope expected: toasts[] array of { id, text, kind: 'default' | 'error' }.
  Usage: paste once near </body>.
-->
<div class="fixed top-[64px] left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none">
  <template x-for="t in toasts" :key="t.id">
    <div x-transition
         :class="t.kind === 'error'
           ? 'bg-[var(--negative-light)] text-[var(--negative)] border-[var(--negative)]/20'
           : 'bg-[var(--surface-elevated)] text-[var(--foreground)] border-[var(--border)]'"
         class="px-4 py-2 text-sm rounded-lg shadow-sm border pointer-events-auto"
         x-text="t.text"></div>
  </template>
</div>
