<!--
  COMPONENT: sortable-table
  Purpose: Sortable, filterable, paginated (50/page) HTML table with a totals row — mirrors the
           base shell's data-table (see DESIGN.md §"Data-table behaviour"). Totals sit on top when
           there's more than one page, at the bottom for a single page.
  Alpine scope expected: rows[], columns[], numericColumns[] (which columns to sum in the totals row).
  Usage: paste inside a card. Sort by clicking headers; type to filter; page with Prev/Next.
-->
<div x-data="{
       sortKey: null, sortDir: 'asc', filterText: '', page: 0, pageSize: 50,
       toggleSort(col) { if (this.sortKey === col) this.sortDir = (this.sortDir === 'asc' ? 'desc' : 'asc'); else { this.sortKey = col; this.sortDir = 'asc'; } this.page = 0; },
       get filteredRows() {
         let out = this.rows;
         if (this.filterText) { const q = this.filterText.toLowerCase(); out = out.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q))); }
         if (this.sortKey) {
           out = [...out].sort((a, b) => {
             const av = a[this.sortKey], bv = b[this.sortKey];
             if (av == null) return 1; if (bv == null) return -1;
             if (typeof av === 'number' && typeof bv === 'number') return this.sortDir === 'asc' ? av - bv : bv - av;
             return this.sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
           });
         }
         return out;
       },
       get pages() { return Math.max(1, Math.ceil(this.filteredRows.length / this.pageSize)); },
       get pageRows() { const p = Math.min(this.page, this.pages - 1); return this.filteredRows.slice(p * this.pageSize, (p + 1) * this.pageSize); },
       get totals() { const t = {}; for (const c of (this.numericColumns || [])) t[c] = this.filteredRows.reduce((a, r) => a + (+r[c] || 0), 0); return t; },
       totalsCell(col) { return (this.numericColumns || []).includes(col) ? this.totals[col].toLocaleString() : (col === this.columns[0] ? 'Total · ' + this.filteredRows.length + ' rows' : '—'); }
     }"
     class="overflow-x-auto">
  <label class="sr-only" :for="$id('filter')">Filter rows</label>
  <input :id="$id('filter')" type="search" x-model="filterText" placeholder="Filter rows…"
         class="mb-3 w-full md:w-64 h-8 px-3 rounded-lg border border-[var(--border)] bg-[var(--surface-elevated)] text-sm focus:border-[var(--primary)] focus:ring-2 focus:ring-[var(--primary)]/20 outline-none">

  <table class="w-full text-sm">
    <thead class="bg-[var(--surface)] border-b border-[var(--border)]">
      <tr>
        <template x-for="col in columns" :key="col">
          <th scope="col"
              :aria-sort="sortKey === col ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'"
              class="text-left px-4 py-2 text-xs font-semibold text-[var(--muted-foreground)] uppercase tracking-wider">
            <button type="button" @click="toggleSort(col)" class="inline-flex items-center gap-1 hover:text-[var(--primary)]">
              <span x-text="col"></span>
              <svg x-show="sortKey === col && sortDir === 'asc'"  width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
              <svg x-show="sortKey === col && sortDir === 'desc'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </th>
        </template>
      </tr>
    </thead>
    <tbody>
      <!-- totals on top when the table spans more than one page -->
      <tr x-show="pages > 1" class="bg-[var(--surface)] border-y-2 border-[var(--border)] font-semibold">
        <template x-for="col in columns" :key="col"><td class="px-4 py-2 tabular-nums" x-text="totalsCell(col)"></td></template>
      </tr>
      <template x-for="(row, i) in pageRows" :key="i">
        <tr class="border-b border-[var(--border-subtle)] hover:bg-[var(--surface)]">
          <template x-for="col in columns" :key="col">
            <td class="px-4 py-2 tabular-nums" x-text="row[col] ?? ''"></td>
          </template>
        </tr>
      </template>
      <!-- totals at the bottom for a single page -->
      <tr x-show="pages <= 1" class="bg-[var(--surface)] border-y-2 border-[var(--border)] font-semibold">
        <template x-for="col in columns" :key="col"><td class="px-4 py-2 tabular-nums" x-text="totalsCell(col)"></td></template>
      </tr>
    </tbody>
  </table>

  <!-- pagination footer -->
  <div class="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-[var(--border-subtle)]">
    <span class="text-xs text-[var(--muted-foreground)] tabular-nums"
          x-text="filteredRows.length ? ('Showing ' + (Math.min(page, pages-1)*pageSize + 1) + '–' + Math.min(filteredRows.length, (Math.min(page, pages-1)+1)*pageSize) + ' of ' + filteredRows.length + ' rows') : '0 rows'"></span>
    <div x-show="pages > 1" class="flex items-center gap-1">
      <button @click="page = Math.max(0, Math.min(page, pages-1) - 1)" :disabled="page === 0"
        class="px-2.5 py-1 rounded-lg border border-[var(--border)] text-xs font-medium disabled:opacity-40 hover:border-[var(--primary)]">Prev</button>
      <span class="text-xs text-[var(--muted-foreground)] tabular-nums px-1" x-text="'Page ' + (Math.min(page, pages-1)+1) + ' / ' + pages"></span>
      <button @click="page = Math.min(pages-1, Math.min(page, pages-1) + 1)" :disabled="Math.min(page, pages-1) >= pages-1"
        class="px-2.5 py-1 rounded-lg border border-[var(--border)] text-xs font-medium disabled:opacity-40 hover:border-[var(--primary)]">Next</button>
    </div>
  </div>
</div>
